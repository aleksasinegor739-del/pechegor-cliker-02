
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍞 ПЕЧЕГОР КЛИКЕР 02</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(160deg,#08091f,#17234b);color:#fff;font-family:Arial,sans-serif;min-height:100vh}
header{text-align:center;padding:20px}
h1{color:#8eeaff;text-shadow:0 0 15px #38bdf8}
.wrap{max-width:1000px;width:94%;margin:auto}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat,.panel{background:#142044;border:1px solid #425b91;border-radius:15px;padding:12px}
.stat{text-align:center}
.stat small{display:block;color:#b9c7e8}
.stat strong{font-size:20px}
.layout{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hero{text-align:center;min-height:380px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.slime{width:180px;height:155px;border-radius:50% 50% 42% 42%;background:radial-gradient(at 30% 20%,#fff,#65dff5 40%,#0875b8);box-shadow:0 0 40px #43dfff;position:relative;animation:bob 2s infinite;transition:background .2s,box-shadow .2s}
@keyframes bob{50%{transform:translateY(-9px)}}
.eyes{position:absolute;top:60px;left:0;right:0;display:flex;justify-content:center;gap:40px}
.eye{width:16px;height:22px;background:#10213d;border-radius:50%}
.mouth{position:absolute;top:105px;left:calc(50% - 8px);width:16px;height:9px;border-bottom:3px solid #173451;border-radius:50%}
.skin-badge{font-size:30px;min-height:38px;margin-bottom:4px}
.tap{border:0;background:none;padding:20px;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.tap:active .slime{transform:scale(.93)}
.hint{color:#b9c7e8}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tab,.action{border:0;border-radius:9px;padding:10px;background:#24547a;color:white;font-weight:bold;cursor:pointer}
.tab.active{background:#55c9ed;color:#07152e}
.action{background:linear-gradient(135deg,#61dafa,#3d92e7);color:#07152e;margin:4px}
.action:disabled{opacity:.4;cursor:not-allowed}
.item,.portal,.petcard,.world-card{background:#0b1531;border:1px solid #34466f;border-radius:12px;padding:12px;margin:9px 0}
.item{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.desc{flex:1;min-width:120px}
.desc small,.muted,small{color:#b9c7e8}
.petgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.petcard{text-align:center}
.petcard .big{font-size:32px}
.petcard small{display:block;margin:4px}
.boss{text-align:center;background:#351c45;border:1px solid #a35b83;padding:14px;border-radius:14px;margin-top:12px}
.boss-icon{font-size:55px}
.progress,.boss-health{height:12px;background:#253452;border-radius:10px;overflow:hidden;margin:9px 0}
.progress span,.boss-health span{display:block;height:100%;background:linear-gradient(90deg,#5ee7ff,#a879ff)}
.notice{text-align:center;color:#aab8dc;font-size:12px}
.world-card.selected{border-color:#5ee7ff;box-shadow:0 0 12px #38bdf855}
@media(max-width:700px){.layout{grid-template-columns:1fr}.stats{font-size:13px}}
</style>
</head>
<body>

<header>
<h1>🍞 ПЕЧЕГОР КЛИКЕР 02</h1>
<p>Исследуй миры, собирай питомцев и побеждай боссов!</p>
</header>

<div class="wrap">
<div class="stats">
<div class="stat"><small>💰 Монеты</small><strong id="coins">0</strong></div>
<div class="stat"><small>⚡ Энергия</small><strong id="energy">100 / 100</strong></div>
<div class="stat"><small>⭐ Уровень</small><strong id="level">1</strong></div>
</div>

<div class="layout">
<div class="panel hero">
<h2 id="rank">Новичок</h2>
<p id="worldLabel">🌲 Лес</p>
<button class="tap" id="tap">
<div class="skin-badge" id="skinBadge">🩵</div>
<div class="slime" id="slime">
<div class="eyes"><div class="eye"></div><div class="eye"></div></div>
<div class="mouth"></div>
</div>
</button>
<p class="hint">Нажимай на слизь!</p>
<p id="perTap">За нажатие: 1</p>
<p id="bonusText">Множитель: x1</p>
</div>

<div class="panel">
<div class="tabs" id="tabs">
<button class="tab active" data-tab="shop">🛒 Магазин</button>
<button class="tab" data-tab="worlds">🌍 Миры</button>
<button class="tab" data-tab="portals">🌀 Порталы</button>
<button class="tab" data-tab="pets">🐾 Питомцы</button>
<button class="tab" data-tab="skins">🎨 Скины</button>
<button class="tab" data-tab="luck">🎡 Удача</button>
<button class="tab" data-tab="inventory">🎒 Инвентарь</button>
<button class="tab" data-tab="rebirth">♻️ Перерождение</button>
<button class="tab" data-tab="index">📖 Индекс</button>
</div>
<div id="content"></div>
</div>
</div>
</div>

<script>
'use strict';

const $=id=>document.getElementById(id);
const SAVE_KEY='pechegor-save';

const defaults={
coins:0,energy:100,maxEnergy:100,level:1,tapPower:1,auto:0,
owned:[],skin:0,upgrades:0,batteryUpgrades:0,equipped:[],
petLevels:{},itemsOwned:[],itemsEquipped:[],
unlockedWorlds:[0],currentWorld:0,bossHP:{},bossesDefeated:[],
rebirths:0,ownedSkins:[0]
};

function loadGame(){
try{
const saved=JSON.parse(localStorage.getItem(SAVE_KEY)||'{}');
const data={...defaults,...saved};

[
'owned','equipped','itemsOwned','itemsEquipped',
'unlockedWorlds','bossesDefeated','ownedSkins'
].forEach(k=>{
if(!Array.isArray(data[k]))data[k]=[];
});

if(!data.petLevels||typeof data.petLevels!=='object')data.petLevels={};
if(!data.bossHP||typeof data.bossHP!=='object')data.bossHP={};

[
'coins','energy','maxEnergy','level','tapPower',
'auto','rebirths','upgrades','batteryUpgrades'
].forEach(k=>{
data[k]=Math.max(0,Number(data[k])||0);
});

data.currentWorld=Math.max(0,Math.floor(Number(data.currentWorld)||0));

data.unlockedWorlds=[...new Set(
data.unlockedWorlds.map(Number).filter(x=>Number.isInteger(x)&&x>=0&&x<=9)
)];
if(!data.unlockedWorlds.includes(0))data.unlockedWorlds.unshift(0);
if(!data.unlockedWorlds.includes(data.currentWorld))data.currentWorld=0;

data.equipped=data.equipped.filter(id=>data.owned.includes(id)).slice(0,5);
data.itemsEquipped=data.itemsEquipped.filter(id=>data.itemsOwned.includes(id)).slice(0,8);

data.ownedSkins=[...new Set(
data.ownedSkins.map(Number).filter(x=>Number.isInteger(x)&&x>=0&&x<=8)
)];
if(!data.ownedSkins.includes(0))data.ownedSkins.unshift(0);
if(!data.ownedSkins.includes(Number(data.skin)))data.skin=0;

return data;
}catch(e){
return {...defaults};
}
}

let s=loadGame();
let activeTab='shop';

const worlds=[
{name:'Лес',icon:'🌲',desc:'Зелёные поляны и древние деревья.',cost:0,boss:'Древний древесник',bossIcon:'🌳',hp:100,reward:500,pet:'🦊'},
{name:'Пустыня',icon:'🏜️',desc:'Песчаные бури и золотые тайны.',cost:1000,boss:'Песчаный голем',bossIcon:'🗿',hp:500,reward:2500,pet:'🐪'},
{name:'Ледяной мир',icon:'❄️',desc:'Ледяные пещеры.',cost:5000,boss:'Ледяной дракон',bossIcon:'🐲',hp:2000,reward:10000,pet:'🐧'},
{name:'Космос',icon:'🚀',desc:'Звёзды и далёкие планеты.',cost:15000,boss:'Звёздный титан',bossIcon:'👾',hp:8000,reward:30000,pet:'🪐'},
{name:'Лавовый мир',icon:'🌋',desc:'Вулканы и огненные пещеры.',cost:40000,boss:'Повелитель лавы',bossIcon:'🔥',hp:30000,reward:80000,pet:'🐉'},
{name:'Подводный мир',icon:'🌊',desc:'Коралловые города.',cost:100000,boss:'Морской левиафан',bossIcon:'🐙',hp:100000,reward:200000,pet:'🦈'},
{name:'Облачный мир',icon:'☁️',desc:'Парящие острова.',cost:250000,boss:'Небесный страж',bossIcon:'🦅',hp:350000,reward:500000,pet:'🪽'},
{name:'Мир конфет',icon:'🍬',desc:'Шоколадные горы и карамельные реки.',cost:600000,boss:'Король конфет',bossIcon:'🍭',hp:1000000,reward:1200000,pet:'🍡'},
{name:'Мир призраков',icon:'👻',desc:'Призрачные замки.',cost:1500000,boss:'Король призраков',bossIcon:'👻',hp:3500000,reward:3000000,pet:'💀'},
{name:'Секретное измерение',icon:'🌀',desc:'Скрытая реальность.',cost:5000000,boss:'Повелитель измерений',bossIcon:'🌀',hp:10000000,reward:10000000,pet:'🔮'}
];

const pets=[
{id:'star',name:'Звёздный малыш',emoji:'⭐',rarity:'Обычный',mult:1},
{id:'moon',name:'Лунный котик',emoji:'🐈',rarity:'Редкий',mult:2},
{id:'alien',name:'Пузырчатый пришелец',emoji:'👾',rarity:'Эпический',mult:4},
{id:'dragon',name:'Космодракон',emoji:'🐉',rarity:'Легендарный',mult:8},
{id:'ghost',name:'Секретная слизь',emoji:'👻',rarity:'Секретный',mult:15},
{id:'fox',name:'Звёздная лисичка',emoji:'🦊',rarity:'Редкий',mult:3},
{id:'robot',name:'Робот-помощник',emoji:'🤖',rarity:'Обычный',mult:1},
{id:'unicorn',name:'Космический единорог',emoji:'🦄',rarity:'Эпический',mult:5},
{id:'octopus',name:'Галактический осьминог',emoji:'🐙',rarity:'Редкий',mult:3},
{id:'phoenix',name:'Золотой феникс',emoji:'🔥',rarity:'Легендарный',mult:10},
{id:'diamond',name:'Алмазный малыш',emoji:'💎',rarity:'Эпический',mult:6},
{id:'crown',name:'Королевская слизь',emoji:'👑',rarity:'Секретный',mult:20},
{id:'shark',name:'Космическая акула',emoji:'🦈',rarity:'Редкий',mult:4},
{id:'bear',name:'Медвежонок-комета',emoji:'🐻',rarity:'Обычный',mult:2},
{id:'planet',name:'Живая планета',emoji:'🪐',rarity:'Легендарный',mult:12},
{id:'comet',name:'Кометный король',emoji:'☄️',rarity:'Легендарный',mult:15},
{id:'nebula',name:'Туманная слизь',emoji:'🌌',rarity:'Секретный',mult:25},
{id:'blackhole',name:'Повелитель чёрной дыры',emoji:'🕳️',rarity:'Мифический',mult:35},
{id:'dimension_pet',name:'Бог измерений',emoji:'🌌',rarity:'Божественный',mult:100}
];

const items=[
{id:'epic_crystal',name:'Кристалл силы',icon:'💎',rarity:'Эпический',tap:.2,auto:0},
{id:'epic_star',name:'Звезда удачи',icon:'🌟',rarity:'Эпический',tap:.1,auto:2},
{id:'legend_crown',name:'Корона галактики',icon:'👑',rarity:'Легендарный',tap:.5,auto:0},
{id:'legend_sword',name:'Меч кометы',icon:'⚔️',rarity:'Легендарный',tap:.25,auto:5},
{id:'mythic_heart',name:'Сердце звезды',icon:'❤️‍🔥',rarity:'Мифический',tap:1,auto:0},
{id:'mythic_eye',name:'Око бездны',icon:'🧿',rarity:'Мифический',tap:.5,auto:15},
{id:'secret_key',name:'Ключ измерений',icon:'🗝️',rarity:'Секретный',tap:1.5,auto:0},
{id:'secret_cube',name:'Тайный куб',icon:'🧊',rarity:'Секретный',tap:0,auto:50},
{id:'relic_hourglass',name:'Песочные часы времени',icon:'⌛',rarity:'Реликвия',tap:.3,auto:10},
{id:'relic_feather',name:'Перышко вечности',icon:'🪶',rarity:'Реликвия',tap:.75,auto:0},
{id:'artifact_orb',name:'Сфера миров',icon:'🔮',rarity:'Артефакт',tap:2,auto:0},
{id:'artifact_book',name:'Книга космоса',icon:'📖',rarity:'Артефакт',tap:0,auto:100},
{id:'amulet_moon',name:'Лунный амулет',icon:'📿',rarity:'Амулет',tap:.4,auto:20},
{id:'amulet_sun',name:'Амулет солнца',icon:'☀️',rarity:'Амулет',tap:1,auto:0},
{id:'ring_magic',name:'Кольцо магии',icon:'💍',rarity:'Магическое кольцо',tap:.6,auto:25},
{id:'ring_void',name:'Кольцо пустоты',icon:'🌀',rarity:'Магическое кольцо',tap:0,auto:300}
];

const skins=[
{name:'Голубая слизь',emoji:'🩵',bg:'radial-gradient(at 30% 20%,#fff,#65dff5 40%,#0875b8)',glow:'#43dfff'},
{name:'Розовая слизь',emoji:'🩷',bg:'radial-gradient(at 30% 20%,#fff,#ff9bd5 40%,#c02687)',glow:'#ff72cb'},
{name:'Золотая слизь',emoji:'💛',bg:'radial-gradient(at 30% 20%,#fff,#ffe66d 40%,#c58b08)',glow:'#ffdc55'},
{name:'Галактическая слизь',emoji:'💜',bg:'radial-gradient(at 30% 20%,#fff,#bd8cff 40%,#5420a8)',glow:'#b77aff'},
{name:'Пчёлка',emoji:'🐝',bg:'repeating-linear-gradient(90deg,#ffd83d 0 35px,#242424 35px 65px)',glow:'#ffdf45'},
{name:'Красная слизь',emoji:'🔴',bg:'radial-gradient(at 30% 20%,#fff,#ff7777 40%,#a90020)',glow:'#ff4d65'},
{name:'Лиса',emoji:'🦊',bg:'radial-gradient(at 30% 20%,#fff,#ffb15c 40%,#b84b13)',glow:'#ff963d'},
{name:'Шахматы',emoji:'♟️',bg:'radial-gradient(at 30% 20%,#fff,#aeb7c8 40%,#29344b)',glow:'#b7c5df'},
{name:'Конус',emoji:'🚧',bg:'repeating-linear-gradient(135deg,#ff9b31 0 25px,#fff 25px 48px)',glow:'#ff9b31'}
];

const fmt=n=>Math.floor(n).toLocaleString('ru-RU');
const petLevel=id=>Math.max(1,Math.min(5,Number(s.petLevels[id])||1));
const equippedItems=()=>s.itemsEquipped.map(id=>items.find(x=>x.id===id)).filter(Boolean);

const petMultiplier=()=>s.equipped.reduce((a,id)=>{
const p=pets.find(x=>x.id===id);
return a+(id==='dimension_pet'?99:(p?.mult||0)*.15*petLevel(id));
},0);

const itemTapBonus=()=>equippedItems().reduce((a,x)=>a+x.tap,0);
const itemAutoBonus=()=>equippedItems().reduce((a,x)=>a+x.auto,0);
const multiplier=()=>1+s.rebirths+petMultiplier()+itemTapBonus();
const autoIncome=()=>s.auto+itemAutoBonus();
const currentWorld=()=>worlds[s.currentWorld];

function save(){
try{
localStorage.setItem(SAVE_KEY,JSON.stringify(s));
}catch(e){
console.warn('Не удалось сохранить игру:',e);
}
}

function updateSkinVisual(){
const skin=skins[s.skin]||skins[0];
$('skinBadge').textContent=skin.emoji;
$('slime').style.background=skin.bg;
$('slime').style.boxShadow='0 0 40px '+skin.glow;
}

function update(){
$('coins').textContent=fmt(s.coins);
$('energy').textContent=fmt(s.energy)+' / '+fmt(s.maxEnergy);
$('level').textContent=s.level;
$('perTap').textContent='За нажатие: '+fmt(s.tapPower*multiplier());
$('bonusText').textContent='Множитель: x'+multiplier().toFixed(2)+' | Перерождений: '+s.rebirths;
$('rank').textContent=s.level>=100?'Легенда':s.level>=50?'Мастер':s.level>=20?'Опытный игрок':'Новичок';
$('worldLabel').textContent=currentWorld().icon+' '+currentWorld().name;

updateSkinVisual();

document.querySelectorAll('.tab').forEach(b=>{
b.classList.toggle('active',b.dataset.tab===activeTab);
});

render();
save();
}

function gain(){
if(s.energy<1)return;
s.energy--;
s.coins+=s.tapPower*multiplier();
s.level=Math.max(1,Math.floor(s.coins/100)+1);
update();
}

const tapButton=$('tap');
let lastTouchTime=0;

tapButton.addEventListener('touchstart',e=>{
e.preventDefault();
lastTouchTime=Date.now();
for(let i=0;i<e.changedTouches.length;i++)gain();
},{passive:false});

tapButton.addEventListener('click',()=>{
if(Date.now()-lastTouchTime<700)return;
gain();
});

document.addEventListener('keydown',e=>{
if(e.code==='Space'&&!e.repeat&&
!['INPUT','TEXTAREA','BUTTON'].includes(document.activeElement.tagName)){
e.preventDefault();
gain();
}
});

$('tabs').addEventListener('click',e=>{
const btn=e.target.closest('[data-tab]');
if(!btn)return;
activeTab=btn.dataset.tab;
update();
});

function buy(cost,fn){
if(s.coins<cost){
alert('Недостаточно монет!');
return false;
}
s.coins-=cost;
fn();
update();
return true;
}

function render(){
const c=$('content');

if(activeTab==='shop'){
const tapCost=Math.floor(20*Math.pow(1.65,s.upgrades));
const autoCost=Math.floor(100*Math.pow(1.8,s.auto));
const batteryCost=Math.floor(150*Math.pow(1.6,s.batteryUpgrades));

c.innerHTML=`
<h2>🛒 Магазин</h2>
<div class="item"><div class="desc"><strong>👆 Сила нажатия</strong><small>Увеличивает монеты за клик.</small></div><strong>${fmt(tapCost)} 💰</strong><button class="action" data-action="tapUpgrade">Улучшить</button></div>
<div class="item"><div class="desc"><strong>🤖 Автокликер</strong><small>Даёт дополнительные монеты каждую секунду.</small></div><strong>${fmt(autoCost)} 💰</strong><button class="action" data-action="autoUpgrade">Купить</button></div>
<div class="item"><div class="desc"><strong>🔋 Батарея</strong><small>Увеличивает максимальную энергию на 25.</small></div><strong>${fmt(batteryCost)} 💰</strong><button class="action" data-action="batteryUpgrade">Улучшить</button></div>
<div class="item"><div class="desc"><strong>⚡ Восстановить энергию</strong><small>Полностью восстанавливает энергию.</small></div><strong>5000 💰</strong><button class="action" data-action="refill">Восстановить</button></div>`;
}

else if(activeTab==='worlds'){
let html='<h2>🌍 Миры</h2>';
worlds.forEach((w,i)=>{
const unlocked=s.unlockedWorlds.includes(i);
const defeated=s.bossesDefeated.includes(i);
html+=`
<div class="world-card ${s.currentWorld===i?'selected':''}">
<strong>${w.icon} ${w.name}</strong><p class="muted">${w.desc}</p>
<p>Босс: ${w.boss}</p><p>Награда: ${fmt(w.reward)} 💰</p>
<p>${defeated?'✅ Босс побеждён':unlocked?'🔓 Открыт':'🔒 Закрыт'}</p>
${unlocked?`<button class="action" data-action="selectWorld" data-id="${i}">Выбрать мир</button>`:
`<p>Цена открытия: ${fmt(w.cost)} 💰</p><button class="action" data-action="unlockWorld" data-id="${i}" ${!s.bossesDefeated.includes(i-1)?'disabled':''}>Открыть</button>`}
</div>`;
});

const w=currentWorld();
const hp=s.bossHP[s.currentWorld]??w.hp;
const defeated=s.bossesDefeated.includes(s.currentWorld);

html+=`
<div class="boss">
<div class="boss-icon">${w.bossIcon}</div><h3>${w.boss}</h3>
<p>Здоровье: ${fmt(defeated?0:hp)} / ${fmt(w.hp)}</p>
<div class="boss-health"><span style="width:${defeated?0:Math.max(0,hp/w.hp*100)}%"></span></div>
${defeated?'<p>🏆 Этот босс уже побеждён!</p>':'<button class="action" data-action="attackBoss">⚔️ Атаковать босса</button>'}
</div>`;
c.innerHTML=html;
}

else if(activeTab==='portals'){
c.innerHTML=`
<h2>🌀 Порталы</h2><p class="muted">Открывай порталы и получай случайных питомцев.</p>
<div class="portal"><h3>🟢 Зелёный портал</h3><p>Стоимость: 100 монет</p><button class="action" data-action="portal" data-type="green">Открыть</button></div>
<div class="portal"><h3>🟣 Фиолетовый портал</h3><p>Стоимость: 500 монет</p><button class="action" data-action="portal" data-type="purple">Открыть</button></div>
<div class="portal"><h3>🟡 Золотой портал</h3><p>Стоимость: 2000 монет</p><button class="action" data-action="portal" data-type="gold">Открыть</button></div>`;
}

else if(activeTab==='pets'){
let html=`<h2>🐾 Питомцы</h2><p>Экипировано: ${s.equipped.length}/5</p><div class="petgrid">`;
pets.forEach(p=>{
const owned=s.owned.includes(p.id);
const equipped=s.equipped.includes(p.id);
const lvl=petLevel(p.id);
html+=`
<div class="petcard"><div class="big">${p.emoji}</div><strong>${p.name}</strong>
<small>${p.rarity}</small><small>Множитель: +${p.mult}%</small>
${owned?`<small>Уровень: ${lvl}/5</small><button class="action" data-action="equipPet" data-id="${p.id}">${equipped?'Снять':'Экипировать'}</button>
${lvl<5?`<button class="action" data-action="upgradePet" data-id="${p.id}">Улучшить (${fmt(lvl*500)} 💰)</button>`:''}`:'<small>Не получен</small>'}
</div>`;
});
html+='</div>';
c.innerHTML=html;
}

else if(activeTab==='skins'){
let html='<h2>🎨 Скины</h2><p class="muted">Выбери внешний вид своей слизи. Купленные скины сохраняются.</p>';
skins.forEach((skin,i)=>{
const owned=s.ownedSkins.includes(i);
html+=`
<div class="item">
<div class="desc"><strong>${skin.emoji} ${skin.name}</strong>${s.skin===i?'<small>Сейчас выбран</small>':''}</div>
${owned?`<button class="action" data-action="selectSkin" data-id="${i}" ${s.skin===i?'disabled':''}>${s.skin===i?'Выбран':'Выбрать'}</button>`:
`<strong>1000 💰</strong><button class="action" data-action="buySkin" data-id="${i}">Купить</button>`}
</div>`;
});
c.innerHTML=html;
}

else if(activeTab==='luck'){
c.innerHTML=`<h2>🎡 Колесо удачи</h2><p>Стоимость одного вращения: 2500 монет.</p><p class="muted">Попробуй получить большой приз!</p><button class="action" data-action="spin">🎡 Крутить колесо</button>`;
}

else if(activeTab==='inventory'){
let html=`<h2>🎒 Инвентарь</h2><p>Экипировано предметов: ${s.itemsEquipped.length}/8</p><button class="action" data-action="chest">🎁 Купить сундук (1500 💰)</button>`;
if(!s.itemsOwned.length)html+='<p class="muted">У тебя пока нет предметов.</p>';
s.itemsOwned.forEach(id=>{
const item=items.find(x=>x.id===id);
if(!item)return;
const equipped=s.itemsEquipped.includes(id);
html+=`
<div class="item"><div class="desc"><strong>${item.icon} ${item.name}</strong>
<small>${item.rarity}</small><small>Бонус к нажатию: +${item.tap}</small><small>Автодоход: +${item.auto}</small></div>
<button class="action" data-action="equipItem" data-id="${id}">${equipped?'Снять':'Экипировать'}</button></div>`;
});
c.innerHTML=html;
}

else if(activeTab==='rebirth'){
const cost=5000000;
c.innerHTML=`
<h2>♻️ Перерождение</h2>
<div class="portal">
<h3>✨ Перерождение</h3>
<p>Стоимость: <strong>${fmt(cost)} монет</strong></p>
<p>Твоих перерождений: <strong>${s.rebirths}</strong></p>
<p>Постоянный бонус: <strong>+${s.rebirths*100}%</strong></p>
<p>После перерождения сбросятся:</p>
<ul>
<li>💰 Монеты, энергия и уровень.</li>
<li>🛒 Все улучшения.</li>
<li>🐾 Все питомцы и их уровни.</li>
<li>🌍 Все открытые миры.</li>
<li>👹 Все победы над боссами.</li>
<li>🎒 Все предметы и экипировка.</li>
<li>🎨 Все открытые скины.</li>
</ul>
<p><strong>Останется только количество перерождений и постоянный бонус к множителю!</strong></p>
<button class="action" data-action="rebirth" ${s.coins<cost?'disabled':''}>♻️ Переродиться</button>
${s.coins<cost?'<p class="muted">Нужно ещё '+fmt(cost-s.coins)+' монет.</p>':''}
</div>`;
}

else if(activeTab==='index'){
let html=`<h2>📖 Индекс питомцев</h2><p>Собрано: ${s.owned.length} / ${pets.length}</p>
<div class="progress"><span style="width:${s.owned.length/pets.length*100}%"></span></div><div class="petgrid">`;
pets.forEach(p=>{
const owned=s.owned.includes(p.id);
html+=`<div class="petcard"><div class="big">${owned?p.emoji:'❔'}</div><strong>${owned?p.name:'Неизвестный питомец'}</strong><small>${owned?p.rarity:'Ещё не найден'}</small></div>`;
});
html+='</div>';
c.innerHTML=html;
}
}

function getRandomPet(pool){
const available=pool.filter(id=>!s.owned.includes(id));
if(!available.length)return null;
return available[Math.floor(Math.random()*available.length)];
}

function givePet(id){
if(!id){
alert('Все питомцы из этого портала уже собраны!');
return;
}
const pet=pets.find(p=>p.id===id);
if(!pet)return;
s.owned.push(id);
alert('🎉 Получен питомец: '+pet.emoji+' '+pet.name);
}

function doRebirth(){
const cost=5000000;

if(s.coins<cost){
alert('Нужно 5 000 000 монет для перерождения!');
return;
}

const confirmed=confirm(
'Переродиться? Весь прогресс, питомцы, миры, боссы, предметы и скины будут сброшены. Сохранится только бонус перерождений.'
);
if(!confirmed)return;

const nextRebirths=s.rebirths+1;

Object.assign(s,{
coins:0,
energy:100,
maxEnergy:100,
level:1,
tapPower:1,
auto:0,
owned:[],
skin:0,
upgrades:0,
batteryUpgrades:0,
equipped:[],
petLevels:{},
itemsOwned:[],
itemsEquipped:[],
unlockedWorlds:[0],
currentWorld:0,
bossHP:{},
bossesDefeated:[],
ownedSkins:[0],
rebirths:nextRebirths
});

activeTab='rebirth';
update();

alert(
'♻️ Перерождение выполнено!\n\n'+
'Весь игровой прогресс сброшен.\n'+
'Количество перерождений: '+s.rebirths+'\n'+
'Постоянный бонус: +'+(s.rebirths*100)+'%'
);
}

$('content').addEventListener('click',e=>{
const btn=e.target.closest('[data-action]');
if(!btn)return;

const action=btn.dataset.action;
const id=btn.dataset.id;

if(action==='tapUpgrade'){
const cost=Math.floor(20*Math.pow(1.65,s.upgrades));
buy(cost,()=>{s.upgrades++;s.tapPower++;});
}

else if(action==='autoUpgrade'){
const cost=Math.floor(100*Math.pow(1.8,s.auto));
buy(cost,()=>{s.auto++;});
}

else if(action==='batteryUpgrade'){
const cost=Math.floor(150*Math.pow(1.6,s.batteryUpgrades));
buy(cost,()=>{
s.batteryUpgrades++;
s.maxEnergy+=25;
s.energy+=25;
});
}

else if(action==='refill'){
buy(5000,()=>{s.energy=s.maxEnergy;});
}

else if(action==='selectWorld'){
const i=Number(id);
if(s.unlockedWorlds.includes(i)){s.currentWorld=i;update();}
}

else if(action==='unlockWorld'){
const i=Number(id);
const w=worlds[i];
if(!w||s.unlockedWorlds.includes(i))return;
if(!s.bossesDefeated.includes(i-1)){
alert('Сначала победи предыдущего босса!');
return;
}
buy(w.cost,()=>{
s.unlockedWorlds.push(i);
s.currentWorld=i;
});
}

else if(action==='attackBoss'){
const i=s.currentWorld;
const w=worlds[i];
if(s.bossesDefeated.includes(i))return;
let hp=s.bossHP[i]??w.hp;
hp-=s.tapPower*multiplier()*10;

if(hp<=0){
hp=0;
s.bossesDefeated.push(i);
s.coins+=w.reward;
if(i<worlds.length-1&&!s.unlockedWorlds.includes(i+1))s.unlockedWorlds.push(i+1);
if(i===worlds.length-1&&!s.owned.includes('dimension_pet')){
s.owned.push('dimension_pet');
alert('🏆 Ты победил последнего босса и получил Бога измерений!');
}else{
alert('🏆 Босс побеждён! Награда: '+fmt(w.reward)+' монет.');
}
}
s.bossHP[i]=hp;
update();
}

else if(action==='portal'){
const type=btn.dataset.type;
let cost=100;
let pool=['star','robot','bear'];

if(type==='purple'){cost=500;pool=['moon','fox','octopus','alien','unicorn','diamond'];}
if(type==='gold'){cost=2000;pool=['dragon','phoenix','ghost','crown','planet','comet','nebula','blackhole'];}

buy(cost,()=>{
const pet=getRandomPet(pool);
if(pet)givePet(pet);
else alert('Все питомцы этого портала уже собраны!');
});
}

else if(action==='equipPet'){
if(s.equipped.includes(id)){
s.equipped=s.equipped.filter(x=>x!==id);
}else{
if(s.equipped.length>=5){alert('Можно экипировать максимум 5 питомцев!');return;}
if(!s.owned.includes(id))return;
s.equipped.push(id);
}
update();
}

else if(action==='upgradePet'){
const lvl=petLevel(id);
if(lvl>=5)return;
buy(lvl*500,()=>{s.petLevels[id]=lvl+1;});
}

else if(action==='selectSkin'){
const i=Number(id);
if(!Number.isInteger(i)||i<0||i>=skins.length)return;
if(!s.ownedSkins.includes(i)){
alert('Сначала купи этот скин!');
return;
}
s.skin=i;
update();
}

else if(action==='buySkin'){
const i=Number(id);
if(!Number.isInteger(i)||i<1||i>=skins.length)return;
if(s.ownedSkins.includes(i))return;
buy(1000,()=>{
s.ownedSkins.push(i);
s.skin=i;
});
}

else if(action==='spin'){
buy(2500,()=>{
const prizes=[10000,5000,2500,1000,500,100];
const weights=[0.5,5,10,15,50,75];
const total=weights.reduce((a,b)=>a+b,0);
let r=Math.random()*total;
let prize=100;
for(let i=0;i<weights.length;i++){
r-=weights[i];
if(r<=0){prize=prizes[i];break;}
}
s.coins+=prize;
alert('🎉 Ты выиграл '+fmt(prize)+' монет!');
});
}

else if(action==='chest'){
buy(1500,()=>{
const available=items.filter(x=>!s.itemsOwned.includes(x.id));
if(!available.length){
alert('Ты уже собрал все предметы!');
s.coins+=1500;
return;
}
const item=available[Math.floor(Math.random()*available.length)];
s.itemsOwned.push(item.id);
alert('🎁 Получен предмет: '+item.icon+' '+item.name);
});
}

else if(action==='equipItem'){
if(s.itemsEquipped.includes(id)){
s.itemsEquipped=s.itemsEquipped.filter(x=>x!==id);
}else{
if(s.itemsEquipped.length>=8){alert('Можно экипировать максимум 8 предметов!');return;}
if(!s.itemsOwned.includes(id))return;
s.itemsEquipped.push(id);
}
update();
}

else if(action==='rebirth'){
doRebirth();
}
});

setInterval(()=>{
let changed=false;

if(s.energy<s.maxEnergy){
s.energy=Math.min(s.maxEnergy,s.energy+1);
changed=true;
}

const income=autoIncome();
if(income>0){
s.coins+=income;
s.level=Math.max(1,Math.floor(s.coins/100)+1);
changed=true;
}

if(changed)update();
},1000);

update();
</script>
</body>
</html>
