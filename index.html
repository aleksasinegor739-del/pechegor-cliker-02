<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ПЕЧЕГОР КЛИКЕР 02</title>
<style>
*{box-sizing:border-box}
body{margin:0;color:#f5f7ff;font-family:system-ui,Arial;min-height:100vh;position:relative;isolation:isolate;overflow-x:hidden;background:linear-gradient(180deg,#08091f,#101638 48%,#080b20);transition:background 1s}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background-image:radial-gradient(2px 2px at 20px 30px,#fff 99%,transparent),radial-gradient(1px 1px at 80px 90px,#9ceeff 99%,transparent),radial-gradient(2px 2px at 150px 40px,#fff 99%,transparent),radial-gradient(1px 1px at 200px 130px,#c5a5ff 99%,transparent);background-size:320px 260px;opacity:.65;animation:stars 55s linear infinite}
body:after{content:"";position:fixed;inset:-30%;pointer-events:none;z-index:-2;background:radial-gradient(ellipse at 15% 25%,#713cff55,transparent 32%),radial-gradient(ellipse at 80% 20%,#087bff55,transparent 30%),radial-gradient(ellipse at 55% 70%,#d02bff33,transparent 35%);filter:blur(35px);animation:nebula 18s ease-in-out infinite alternate}
@keyframes stars{to{background-position:320px 520px}}
@keyframes nebula{50%{transform:translate(2%,2%) scale(1.08)}}
@keyframes bob{50%{transform:translateY(-9px) scale(1.025,.98)}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes float{to{transform:translateY(-80px);opacity:0}}
header{text-align:center;padding:20px 10px 8px}
h1{margin:0;color:#9ceeff;font-size:clamp(24px,5vw,40px);text-shadow:0 0 18px #36c9ff}
header p{color:#b9c7e8;margin:5px}
.wrap{width:min(1000px,94vw);margin:auto;position:relative}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px 0}
.stat,.panel{background:#121d3bed;border:1px solid #3b4d7b;border-radius:17px;box-shadow:0 10px 30px #0004}
.stat{text-align:center;padding:10px}
.stat small{display:block;color:#b9c7e8;font-size:12px}
.stat strong{font-size:clamp(17px,3vw,24px)}
.layout{display:grid;grid-template-columns:1.1fr .9fr;gap:13px}
.panel{padding:15px}
.hero{text-align:center;min-height:390px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
.rank{color:#ffdc78;font-weight:800;margin-bottom:8px}
.tap{border:0;background:none;width:min(270px,75vw);height:255px;display:grid;place-items:center;position:relative;cursor:pointer;touch-action:none}
.slime{width:190px;height:165px;border-radius:48% 52% 43% 47%/58% 60% 38% 40%;position:relative;background:radial-gradient(ellipse at 32% 22%,#ffffffc9 0 5%,#b8f7ff99 18%,#55d7f2b8 52%,#1593c9d9 100%);border:2px solid #bdf7ffb0;box-shadow:inset -18px -18px 35px #0879b377,inset 14px 12px 25px #ffffff55,0 0 45px #4adfff99;animation:bob 2.5s ease-in-out infinite}
.shine{position:absolute;top:22px;left:38px;width:48px;height:22px;border-radius:50%;background:#fff9;transform:rotate(-28deg);filter:blur(2px)}
.eyes{position:absolute;top:66px;left:0;right:0;display:flex;justify-content:center;gap:43px}
.eye{width:18px;height:25px;background:#10213d;border-radius:50%;box-shadow:inset 4px 3px #fff}
.mouth{position:absolute;top:108px;left:calc(50% - 9px);width:19px;height:11px;border-bottom:4px solid #173451;border-radius:50%}
.crown{position:absolute;z-index:2;top:2px;left:50%;transform:translateX(-50%) rotate(-7deg);font-size:66px;filter:drop-shadow(0 5px 5px #0008)}
.orbit{position:absolute;inset:10px;pointer-events:none;animation:orbit 9s linear infinite}
.petfloat{position:absolute;font-size:31px;filter:drop-shadow(0 0 8px #fff9)}
.petfloat:nth-child(1){top:15px;left:12%}
.petfloat:nth-child(2){right:8%;top:55%}
.petfloat:nth-child(3){left:8%;bottom:12%}
.petfloat:nth-child(4){right:12%;top:12%}
.petfloat:nth-child(5){left:48%;bottom:2%}
.hint{color:#b9c7e8;margin:0}
.hint b{color:#9ceeff}
.float{position:absolute;color:#ffe58c;font-weight:900;font-size:22px;pointer-events:none;animation:float .8s forwards;text-shadow:0 2px 8px #000}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tab{border:1px solid #3b4d7b;background:#0b1531;color:white;padding:8px 10px;border-radius:11px;cursor:pointer;font-weight:700}
.tab.active{background:#24547a;border-color:#71ddff}
h2{font-size:19px;margin:4px 0 10px}
h3{font-size:16px}
.item{display:flex;align-items:center;gap:9px;padding:10px;margin:8px 0;background:#0b1531;border:1px solid #2c3c68;border-radius:12px}
.emoji{font-size:27px}
.desc{flex:1;min-width:0}
.desc b{display:block}
.desc small,.muted{color:#b9c7e8;font-size:12px}
.action{border:0;border-radius:10px;background:linear-gradient(135deg,#61dafa,#3d92e7);color:#07152e;font-weight:900;padding:9px 11px;cursor:pointer}
.action:disabled{opacity:.45;cursor:not-allowed}
.portal{padding:13px;border-radius:14px;margin:9px 0;background:linear-gradient(120deg,#143e58,#24204f);border:1px solid #5a77b9}
.portal h3{margin:0 0 5px}
.portal p{color:#b9c7e8;font-size:13px;margin:0 0 9px}
.petgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.petcard{background:#0b1531;border:1px solid #2c3c68;border-radius:12px;padding:10px;text-align:center}
.petcard .big{font-size:30px}
.petcard small{display:block;color:#b9c7e8}
.notice{text-align:center;color:#aab8dc;font-size:12px;margin-top:12px}
.rarity{font-size:11px;font-weight:900;display:inline-block;padding:3px 7px;border-radius:8px;margin:4px 0}
.epic{color:#d9a5ff;background:#782bb533;border:1px solid #a855f7}
.legendary{color:#ffe28a;background:#b9851933;border:1px solid #eab308}
.mythic{color:#ff9b9b;background:#b91c1c33;border:1px solid #ef4444}
.secret{color:#8ffff0;background:#0d948833;border:1px solid #2dd4bf}
.relic{color:#ffd5a1;background:#b4530933;border:1px solid #f59e0b}
.artifact{color:#b9c6ff;background:#3730a333;border:1px solid #818cf8}
.amulet{color:#ffbde9;background:#be185d33;border:1px solid #f472b6}
.ring{color:#c7f9ff;background:#0e749033;border:1px solid #67e8f9}
.inventory-card{background:#0b1531;border:1px solid #34466f;border-radius:13px;padding:11px;margin:9px 0}
.inventory-card.equipped{border-color:#61dafa;box-shadow:0 0 12px #61dafa33}
.inventory-top{display:flex;gap:10px;align-items:center}
.inventory-icon{font-size:32px}
.inventory-info{flex:1}
.inventory-info small{display:block;color:#b9c7e8}
.inventory-card button{margin-top:8px}
.world-card{border:1px solid #42557e;background:#0b1531;border-radius:14px;padding:12px;margin:10px 0}
.world-card.current{border:2px solid #70e3ff;box-shadow:0 0 16px #46cfff33}
.world-card.locked{opacity:.8}
.world-head{display:flex;gap:12px;align-items:center}
.world-icon{font-size:38px}
.world-head div:nth-child(2){flex:1}
.world-head small{color:#b9c7e8}
.progress{height:10px;border-radius:10px;background:#253452;overflow:hidden;margin:8px 0}
.progress span{display:block;height:100%;background:linear-gradient(90deg,#5ee7ff,#a879ff);width:0}
.boss{padding:15px;text-align:center;border:1px solid #a35b83;background:linear-gradient(135deg,#351c45,#17294a);border-radius:15px;margin:12px 0}
.boss-icon{font-size:60px}
.boss-health{height:13px;border-radius:10px;background:#351b2b;overflow:hidden;margin:10px 0}
.boss-health span{height:100%;display:block;background:linear-gradient(90deg,#ff477e,#ffb24a);transition:width .2s}
body[data-world="forest"]{background:linear-gradient(180deg,#092b20,#174a35 55%,#081b20)}
body[data-world="desert"]{background:linear-gradient(180deg,#4a2815,#a65b28 55%,#27152a)}
body[data-world="ice"]{background:linear-gradient(180deg,#092b50,#246b91 55%,#101b3c)}
body[data-world="space"]{background:linear-gradient(180deg,#08091f,#25164f 55%,#080b20)}
body[data-world="lava"]{background:linear-gradient(180deg,#40100c,#9b3217 55%,#1d0a17)}
body[data-world="ocean"]{background:linear-gradient(180deg,#032c46,#075b79 55%,#061a39)}
body[data-world="cloud"]{background:linear-gradient(180deg,#38638d,#8b9dd4 55%,#2b285c)}
body[data-world="candy"]{background:linear-gradient(180deg,#54204f,#b44d9b 55%,#3a1748)}
body[data-world="ghost"]{background:linear-gradient(180deg,#14102c,#38235c 55%,#100d20)}
body[data-world="secret"]{background:linear-gradient(180deg,#071c25,#164d56 55%,#08091f)}
@media(max-width:720px){.layout{grid-template-columns:1fr}.hero{min-height:350px}.panel{padding:12px}.stats{gap:6px}.stat{padding:8px 3px}}
</style>
</head>
<body data-world="forest">
<header>
<h1>🍞 ПЕЧЕГОР КЛИКЕР 02</h1>
<p>Исследуй миры, побеждай боссов и собирай печеогароки!</p>
</header>
<main class="wrap">
<div class="stats">
<div class="stat"><small>🍞 Печеогароки</small><strong id="coins">0</strong></div>
<div class="stat"><small>⚡ Энергия</small><strong id="energy">100 / 100</strong></div>
<div class="stat"><small>⭐ Уровень</small><strong id="level">1</strong></div>
</div>
<div class="layout">
<section class="panel hero">
<div class="rank" id="rank">КОСМИЧЕСКИЙ НОВИЧОК</div>
<div id="worldLabel" class="notice">🌲 Лес</div>
<div class="orbit" id="orbit"></div>
<button class="tap" id="tap" aria-label="Нажать на слизь">
<div class="crown">👑</div>
<div class="slime skin-blue" id="slime">
<div class="shine"></div><div class="eyes"><i class="eye"></i><i class="eye"></i></div><div class="mouth"></div>
</div>
</button>
<p class="hint">Нажимай на слизь! <b id="perTap">+1 🍞</b></p>
<p class="notice">Телефон: касайся · ПК: мышь или пробел</p>
<p class="notice" id="bonusText"></p>
</section>
<section class="panel">
<nav class="tabs">
<button class="tab active" data-tab="shop">🛒 Магазин</button>
<button class="tab" data-tab="worlds">🌍 Миры</button>
<button class="tab" data-tab="portals">🌀 Порталы</button>
<button class="tab" data-tab="pets">🐾 Питомцы</button>
<button class="tab" data-tab="skins">🎨 Скины</button>
<button class="tab" data-tab="luck">🎡 Удача</button>
<button class="tab" data-tab="inventory">🎒 Инвентарь</button>
</nav>
<div id="content"></div>
</section>
</div>
</main>
<script>
const $=id=>document.getElementById(id);
const defaults={
coins:0,energy:100,maxEnergy:100,level:1,tapPower:1,auto:0,
owned:[],skin:0,upgrades:0,batteryUpgrades:0,equipped:[],
petLevels:{},itemsOwned:[],itemsEquipped:[],
unlockedWorlds:[0],currentWorld:0,bossHP:{},bossesDefeated:[]
};
let saved={};
try{saved=JSON.parse(localStorage.getItem('pechegor-save')||'{}')||{}}catch(e){}
let s={...defaults,...saved};
s.owned=Array.isArray(s.owned)?s.owned:[];
s.equipped=Array.isArray(s.equipped)?s.equipped.filter(id=>s.owned.includes(id)).slice(0,5):[];
s.petLevels=s.petLevels&&typeof s.petLevels==='object'?s.petLevels:{};
s.itemsOwned=Array.isArray(s.itemsOwned)?s.itemsOwned:[];
s.itemsEquipped=Array.isArray(s.itemsEquipped)?s.itemsEquipped.filter(id=>s.itemsOwned.includes(id)).slice(0,8):[];
s.unlockedWorlds=Array.isArray(s.unlockedWorlds)?s.unlockedWorlds:[0];
s.unlockedWorlds.push(0);
s.unlockedWorlds=[...new Set(s.unlockedWorlds.filter(n=>Number.isInteger(n)&&n>=0&&n<10))];
s.bossHP=s.bossHP&&typeof s.bossHP==='object'?s.bossHP:{};
s.bossesDefeated=Array.isArray(s.bossesDefeated)?s.bossesDefeated:[];
s.currentWorld=Number.isInteger(s.currentWorld)&&s.unlockedWorlds.includes(s.currentWorld)?s.currentWorld:0;
if(!Number.isFinite(s.coins)||s.coins<0)s.coins=0;
if(!Number.isFinite(s.energy)||s.energy<0)s.energy=100;
if(!Number.isFinite(s.maxEnergy)||s.maxEnergy<1)s.maxEnergy=100;
if(!Number.isFinite(s.level)||s.level<1)s.level=1;
if(!Number.isFinite(s.tapPower)||s.tapPower<1)s.tapPower=1;
if(!Number.isFinite(s.auto)||s.auto<0)s.auto=0;
if(!Number.isFinite(s.upgrades)||s.upgrades<0)s.upgrades=0;
if(!Number.isInteger(s.skin)||s.skin<0||s.skin>8)s.skin=0;
if(!Number.isInteger(s.batteryUpgrades)||s.batteryUpgrades<0)s.batteryUpgrades=0;
let tab='shop';

const worlds=[
{id:'forest',name:'Лес',icon:'🌲',desc:'Зелёные поляны, древние деревья и лесные сокровища.',cost:0,boss:'Древний древесник',bossIcon:'🌳',hp:100,reward:500,pet:'🦊'},
{id:'desert',name:'Пустыня',icon:'🏜️',desc:'Песчаные бури, пирамиды и золотые тайны.',cost:1000,boss:'Песчаный голем',bossIcon:'🗿',hp:500,reward:2500,pet:'🐪'},
{id:'ice',name:'Ледяной мир',icon:'❄️',desc:'Ледяные пещеры и замороженные сокровища.',cost:5000,boss:'Ледяной дракон',bossIcon:'🐲',hp:2000,reward:10000,pet:'🐧'},
{id:'space',name:'Космос',icon:'🚀',desc:'Звёзды, далёкие планеты и космические тайны.',cost:15000,boss:'Звёздный титан',bossIcon:'👾',hp:8000,reward:30000,pet:'🪐'},
{id:'lava',name:'Лавовый мир',icon:'🌋',desc:'Вулканы, огненные пещеры и горячие сокровища.',cost:40000,boss:'Повелитель лавы',bossIcon:'🔥',hp:30000,reward:80000,pet:'🐉'},
{id:'ocean',name:'Подводный мир',icon:'🌊',desc:'Коралловые города и затонувшие сокровища.',cost:100000,boss:'Морской левиафан',bossIcon:'🐙',hp:100000,reward:200000,pet:'🦈'},
{id:'cloud',name:'Облачный мир',icon:'☁️',desc:'Парящие острова и небесные замки.',cost:250000,boss:'Небесный страж',bossIcon:'🦅',hp:350000,reward:500000,pet:'🪽'},
{id:'candy',name:'Мир конфет',icon:'🍬',desc:'Шоколадные горы, карамельные реки и сладости.',cost:600000,boss:'Король конфет',bossIcon:'🍭',hp:1000000,reward:1200000,pet:'🍡'},
{id:'ghost',name:'Мир призраков',icon:'👻',desc:'Призрачные замки и загадочные существа.',cost:1500000,boss:'Король призраков',bossIcon:'👻',hp:3500000,reward:3000000,pet:'💀'},
{id:'secret',name:'Секретное измерение',icon:'🌀',desc:'Скрытая реальность. Здесь живут самые редкие тайны.',cost:5000000,boss:'Повелитель измерений',bossIcon:'🌀',hp:10000000,reward:10000000,pet:'🔮'}
];

const pets=[
{id:'star',name:'Звёздный малыш',emoji:'⭐',rarity:'Обычный',mult:1},
{id:'moon',name:'Лунный котик',emoji:'🐈',rarity:'Редкий',mult:2},
{id:'alien',name:'Пузырчатый пришелец',emoji:'👾',rarity:'Эпический',mult:4},
{id:'dragon',name:'Космодракон',emoji:'🐉',rarity:'Легендарный',mult:8},
{id:'ghost',name:'Секретная слизь',emoji:'👻',rarity:'Секретный',mult:15},
{id:'fox',name:'Звёздная лисичка',emoji:'🦊',rarity:'Редкий',mult:3},
{id:'robot',name:'Робот-помощник',emoji:'🤖',rarity:'Обычный',mult:1},
{id:'unicorn',name:'Космический единорог',emoji:'🦄',rarity:'Эпический',mult:5},
{id:'octopus',name:'Галактический осьминог',emoji:'🐙',rarity:'Редкий',mult:3},
{id:'phoenix',name:'Золотой феникс',emoji:'🔥',rarity:'Легендарный',mult:10},
{id:'diamond',name:'Алмазный малыш',emoji:'💎',rarity:'Эпический',mult:6},
{id:'crown',name:'Королевская слизь',emoji:'👑',rarity:'Секретный',mult:20},
{id:'shark',name:'Космическая акула',emoji:'🦈',rarity:'Редкий',mult:4},
{id:'bear',name:'Медвежонок-комета',emoji:'🐻',rarity:'Обычный',mult:2},
{id:'planet',name:'Живая планета',emoji:'🪐',rarity:'Легендарный',mult:12},
{id:'comet',name:'Кометный король',emoji:'☄️',rarity:'Легендарный',mult:15},
{id:'nebula',name:'Туманная слизь',emoji:'🌌',rarity:'Секретный',mult:25},
{id:'blackhole',name:'Повелитель чёрной дыры',emoji:'🕳️',rarity:'Мифический',mult:35},
{id:'dimension_pet',name:'Бог измерений',emoji:'🌌',rarity:'Божественный',mult:100}
];

// 🎁 НАГРАДА ДЛЯ СТАРЫХ СОХРАНЕНИЙ:
// Если последний босс уже побеждён, выдаём питомца автоматически.
let retroactivePetAward=false;
if(s.bossesDefeated.includes(9)&&!s.owned.includes('dimension_pet')){
  s.owned.push('dimension_pet');
  s.petLevels.dimension_pet=1;
  retroactivePetAward=true;
  try{
    localStorage.setItem('pechegor-save',JSON.stringify(s));
  }catch(e){}
}

const skins=[
{name:'Голубая слизь',emoji:'🩵',className:'blue'},
{name:'Розовая слизь',emoji:'🩷',className:'pink'},
{name:'Золотая слизь',emoji:'💛',className:'gold'},
{name:'Галактическая слизь',emoji:'💜',className:'galaxy'},
{name:'Пчёлка',emoji:'🐝',className:'bee'},
{name:'Красная слизь',emoji:'🔴',className:'red'},
{name:'Лиса',emoji:'🦊',className:'fox'},
{name:'Шахматы',emoji:'♟️',className:'chess'},
{name:'Конус',emoji:'🚧',className:'cone'}
];
const items=[
{id:'epic_crystal',name:'Кристалл силы',icon:'💎',category:'Эпический предмет',rarity:'Эпический',css:'epic',desc:'+20% к силе клика',tap:.20,auto:0},
{id:'epic_star',name:'Звезда удачи',icon:'🌟',category:'Эпический предмет',rarity:'Эпический',css:'epic',desc:'+10% к силе клика и +2 в секунду',tap:.10,auto:2},
{id:'legend_crown',name:'Корона галактики',icon:'👑',category:'Легендарный предмет',rarity:'Легендарный',css:'legendary',desc:'+50% к силе клика',tap:.50,auto:0},
{id:'legend_sword',name:'Меч кометы',icon:'⚔️',category:'Легендарный предмет',rarity:'Легендарный',css:'legendary',desc:'+25% к клику и +5 в секунду',tap:.25,auto:5},
{id:'mythic_heart',name:'Сердце звезды',icon:'❤️‍🔥',category:'Мифический предмет',rarity:'Мифический',css:'mythic',desc:'+100% к силе клика',tap:1,auto:0},
{id:'mythic_eye',name:'Око бездны',icon:'🧿',category:'Мифический предмет',rarity:'Мифический',css:'mythic',desc:'+50% к клику и +15 в секунду',tap:.5,auto:15},
{id:'secret_key',name:'Ключ измерений',icon:'🗝️',category:'Секретный предмет',rarity:'Секретный',css:'secret',desc:'+150% к силе клика',tap:1.5,auto:0},
{id:'secret_cube',name:'Тайный куб',icon:'🧊',category:'Секретный предмет',rarity:'Секретный',css:'secret',desc:'+50 в секунду',tap:0,auto:50},
{id:'relic_hourglass',name:'Песочные часы времени',icon:'⌛',category:'Реликвия',rarity:'Реликвия',css:'relic',desc:'+30% к клику и +10 в секунду',tap:.3,auto:10},
{id:'relic_feather',name:'Перышко вечности',icon:'🪶',category:'Реликвия',rarity:'Реликвия',css:'relic',desc:'+75% к силе клика',tap:.75,auto:0},
{id:'artifact_orb',name:'Сфера миров',icon:'🔮',category:'Артефакт',rarity:'Артефакт',css:'artifact',desc:'+200% к силе клика',tap:2,auto:0},
{id:'artifact_book',name:'Книга космоса',icon:'📖',category:'Артефакт',rarity:'Артефакт',css:'artifact',desc:'+100 в секунду',tap:0,auto:100},
{id:'amulet_moon',name:'Лунный амулет',icon:'📿',category:'Амулет',rarity:'Амулет',css:'amulet',desc:'+40% к клику и +20 в секунду',tap:.4,auto:20},
{id:'amulet_sun',name:'Амулет солнца',icon:'☀️',category:'Амулет',rarity:'Амулет',css:'amulet',desc:'+100% к силе клика',tap:1,auto:0},
{id:'ring_magic',name:'Кольцо магии',icon:'💍',category:'Магическое кольцо',rarity:'Магическое кольцо',css:'ring',desc:'+60% к клику и +25 в секунду',tap:.6,auto:25},
{id:'ring_void',name:'Кольцо пустоты',icon:'🌀',category:'Магическое кольцо',rarity:'Магическое кольцо',css:'ring',desc:'+300 в секунду',tap:0,auto:300}
];

const fmt=n=>Math.floor(n).toLocaleString('ru-RU');
function save(){try{localStorage.setItem('pechegor-save',JSON.stringify(s))}catch(e){}}
function petLevel(id){return Math.max(1,Math.min(5,Number(s.petLevels[id])||1))}

// Бог измерений даёт настоящий множитель x100 при экипировке.
function petMultiplier(){
return s.equipped.reduce((a,id)=>{
const p=pets.find(x=>x.id===id);
if(!p)return a;
return a+(id==='dimension_pet'?99:(p.mult||0)*.15*petLevel(id));
},0);
}
function equippedItems(){return s.itemsEquipped.map(id=>items.find(x=>x.id===id)).filter(Boolean)}
function itemTapBonus(){return equippedItems().reduce((a,x)=>a+x.tap,0)}
function itemAutoBonus(){return equippedItems().reduce((a,x)=>a+x.auto,0)}
function multiplier(){return 1+petMultiplier()+itemTapBonus()}
function autoIncome(){return s.auto+itemAutoBonus()}
function currentWorld(){return worlds[s.currentWorld]}

function update(){
$('coins').textContent=fmt(s.coins);
$('energy').textContent=`${Math.floor(s.energy)} / ${s.maxEnergy}`;
$('level').textContent=s.level;
$('perTap').textContent=`+${fmt(s.tapPower*multiplier())} 🍞`;
$('rank').textContent=s.level<5?'КОСМИЧЕСКИЙ НОВИЧОК':s.level<12?'ПОВЕЛИТЕЛЬ ПЕЧЕОГАРОКОВ':'КОСМИЧЕСКИЙ КОРОЛЬ';
$('slime').className='slime skin-'+(skins[s.skin]?.className||'blue');
$('orbit').innerHTML=s.equipped.slice(0,5).map(id=>`<span class="petfloat">${pets.find(p=>p.id===id)?.emoji||'⭐'}</span>`).join('');
$('bonusText').textContent=`Бонус предметов: +${Math.round(itemTapBonus()*100)}% к клику · +${fmt(itemAutoBonus())}/сек`;
$('worldLabel').textContent=currentWorld().icon+' '+currentWorld().name;
document.body.dataset.world=currentWorld().id;
document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
render();save();
}
function gain(){
if(s.energy<1)return;
s.energy--;
let n=s.tapPower*multiplier();
s.coins+=n;s.level=Math.max(s.level,1+Math.floor(s.coins/100));
update();
let f=document.createElement('span');f.className='float';f.textContent=`+${fmt(n)} 🍞`;
f.style.left=(35+Math.random()*30)+'%';f.style.top='43%';
document.querySelector('.hero').append(f);setTimeout(()=>f.remove(),850);
}
const tapButton=$('tap');let lastTouchTime=0;
tapButton.addEventListener('touchstart',e=>{e.preventDefault();lastTouchTime=Date.now();for(const touch of e.changedTouches)gain()},{passive:false});
tapButton.addEventListener('click',e=>{e.preventDefault();if(Date.now()-lastTouchTime>700)gain()});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();gain()}});
setInterval(()=>{
let changed=false;
if(s.energy<s.maxEnergy){s.energy=Math.min(s.maxEnergy,s.energy+1);changed=true}
if(autoIncome()>0){s.coins+=autoIncome();s.level=Math.max(s.level,1+Math.floor(s.coins/100));changed=true}
if(changed)update();
},1000);
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;update()}));
function buy(cost,fn){if(s.coins<cost){alert('Не хватает печеогароков!');return} s.coins-=cost;fn();update()}

function render(){
let c=$('content');
if(tab==='worlds'){
const w=currentWorld(),hp=s.bossHP[s.currentWorld]??w.hp;
const defeated=s.bossesDefeated.includes(s.currentWorld);
c.innerHTML=`<h2>🌍 Карта миров</h2>
<p class="muted">Исследуй миры по порядку. Чтобы открыть следующий мир, победи босса текущего мира и заплати стоимость открытия.</p>
<div class="portal"><h3>Сейчас ты в мире: ${w.icon} ${w.name}</h3><p>${w.desc}</p><p>Местный питомец: ${w.pet}</p></div>
${worlds.map((x,i)=>{
let unlocked=s.unlockedWorlds.includes(i),active=s.currentWorld===i,done=s.bossesDefeated.includes(i);
return `<div class="world-card ${active?'current':''} ${unlocked?'':'locked'}">
<div class="world-head"><div class="world-icon">${x.icon}</div><div><b>${x.name}</b><br><small>${x.desc}</small></div></div>
<p class="muted">${unlocked?(done?'🏆 Босс побеждён':'🔓 Мир открыт'):'🔒 Цена открытия: '+fmt(x.cost)+' 🍞'}</p>
${unlocked?`<button class="action" data-enter="${i}">${active?'Ты здесь':'Перейти в мир'}</button>`:
`<button class="action" data-unlock="${i}" ${(!s.bossesDefeated.includes(i-1)||s.coins<x.cost)?'disabled':''}>Открыть · ${fmt(x.cost)} 🍞</button>
${i>0&&!s.bossesDefeated.includes(i-1)?'<p class="muted">Сначала победи босса предыдущего мира.</p>':''}`}
${done?'<span class="rarity legendary">Босс побеждён</span>':''}
</div>`;
}).join('')}
<div class="boss">
<h3>👹 Босс мира: ${w.boss}</h3>
<div class="boss-icon">${w.bossIcon}</div>
<p>${defeated?'Ты уже победил этого босса!':'Победи босса, чтобы открыть путь в следующий мир.'}</p>
<div class="boss-health"><span style="width:${Math.max(0,hp/w.hp*100)}%"></span></div>
<p>Здоровье: <b>${fmt(hp)} / ${fmt(w.hp)}</b></p>
<p class="muted">Урон за атаку: ${fmt(Math.max(1,s.tapPower*multiplier()*10))}</p>
<button class="action" id="attackBoss" ${defeated?'disabled':''}>⚔️ Атаковать босса</button>
${defeated?'<p class="notice">Награда за победу уже получена.</p>':''}
</div>`;
c.querySelectorAll('[data-enter]').forEach(b=>b.onclick=()=>{s.currentWorld=Number(b.dataset.enter);update()});
c.querySelectorAll('[data-unlock]').forEach(b=>b.onclick=()=>{
let i=Number(b.dataset.unlock),world=worlds[i];
if(!s.bossesDefeated.includes(i-1)){alert('Сначала победи босса предыдущего мира!');return}
if(s.coins<world.cost){alert('Не хватает печеогароков!');return}
s.coins-=world.cost;s.unlockedWorlds.push(i);s.currentWorld=i;update();
});
const attack=$('attackBoss');
if(attack)attack.onclick=()=>{
if(s.bossesDefeated.includes(s.currentWorld))return;
let damage=Math.max(1,s.tapPower*multiplier()*10);
s.bossHP[s.currentWorld]=Math.max(0,hp-damage);
if(s.bossHP[s.currentWorld]<=0){
s.bossesDefeated.push(s.currentWorld);
s.coins+=w.reward;
s.level=Math.max(s.level,1+Math.floor(s.coins/100));

if(s.currentWorld===9){
const petId='dimension_pet';
if(!s.owned.includes(petId)){
s.owned.push(petId);
s.petLevels[petId]=1;
}
alert(`🌌 НЕВЕРОЯТНАЯ ПОБЕДА!

Ты победил Повелителя измерений!

🎁 ПОЛУЧЕН БОЖЕСТВЕННЫЙ ПИТОМЕЦ!

🌌 Бог измерений
⚡ Бонус: x100

Зайди во вкладку «🐾 Питомцы» и нажми «Выбрать», чтобы экипировать его.

🍞 Награда: ${fmt(w.reward)}`);
}else{
alert(`🏆 ПОБЕДА!
Ты победил: ${w.boss}!
Награда: ${fmt(w.reward)} 🍞`);
}

// Победа над боссом открывает следующий мир бесплатно.
if(s.currentWorld<worlds.length-1&&!s.unlockedWorlds.includes(s.currentWorld+1)){
s.unlockedWorlds.push(s.currentWorld+1);
}
}else{
$('content').querySelector('.boss-health span').style.width=(s.bossHP[s.currentWorld]/w.hp*100)+'%';
}
update();
};
}
else if(tab==='shop'){
let tc=Math.floor(20*Math.pow(1.65,s.upgrades));
let ac=Math.floor(100*Math.pow(1.8,s.auto));
let batteryCost=Math.floor(150*Math.pow(1.6,s.batteryUpgrades));
c.innerHTML=`<h2>Улучшения</h2>
<div class="item"><span class="emoji">👆</span><div class="desc"><b>Сильный тап</b><small>+1 печеогарок за нажатие</small></div><button class="action" id="bt">🍞 ${fmt(tc)}</button></div>
<div class="item"><span class="emoji">🤖</span><div class="desc"><b>Автосборщик</b><small>+1 печеогарок в секунду</small></div><button class="action" id="ba">🍞 ${fmt(ac)}</button></div>
<div class="item"><span class="emoji">⚡</span><div class="desc"><b>Батарея</b><small>+25 к максимуму энергии · Улучшений: ${s.batteryUpgrades}</small></div><button class="action" id="be">🍞 ${fmt(batteryCost)}</button></div>
<div class="item"><span class="emoji">🔋</span><div class="desc"><b>Пополнить энергию</b><small>Полностью восстанавливает энергию</small></div><button class="action" id="refill" ${s.energy>=s.maxEnergy?'disabled':''}>🍞 5000</button></div>`;
$('bt').onclick=()=>buy(tc,()=>{s.tapPower++;s.upgrades++});
$('ba').onclick=()=>buy(ac,()=>s.auto++);
$('be').onclick=()=>buy(batteryCost,()=>{s.maxEnergy+=25;s.energy=s.maxEnergy;s.batteryUpgrades++});
$('refill').onclick=()=>{if(s.energy>=s.maxEnergy){alert('Энергия уже полная!');return}buy(5000,()=>s.energy=s.maxEnergy)};
}
else if(tab==='portals'){
c.innerHTML=`<h2>Космические порталы</h2>
<div class="portal"><h3>🟢 Зелёный портал</h3><p>Обычные и редкие питомцы</p><button class="action" id="p1">Открыть · 100 🍞</button></div>
<div class="portal"><h3>🟣 Фиолетовый портал</h3><p>Редкие и эпические питомцы</p><button class="action" id="p2">Открыть · 500 🍞</button></div>
<div class="portal"><h3>🟡 Золотой портал</h3><p>Эпические, легендарные и секретные питомцы</p><button class="action" id="p3">Открыть · 2 000 🍞</button></div>
<p class="notice">Повторный питомец превращается в 50 🍞.</p>`;
$('p1').onclick=()=>portal(100,['star','star','robot','bear','moon','fox','shark']);
$('p2').onclick=()=>portal(500,['moon','fox','octopus','alien','unicorn','diamond','shark']);
$('p3').onclick=()=>portal(2000,['alien','dragon','ghost','phoenix','diamond','crown','planet','comet','nebula','blackhole']);
}
else if(tab==='pets'){
const owned=s.owned.filter(id=>pets.some(p=>p.id===id));
c.innerHTML=`<h2>Мои питомцы</h2><p class="notice">Выбери до 5 питомцев — они будут летать вокруг слизи и усиливать тап.</p><p>На орбите: <b>${s.equipped.length}/5</b></p><div class="petgrid">`+
(owned.length?owned.map(id=>{
let p=pets.find(x=>x.id===id),lv=petLevel(id),cost=lv*500,active=s.equipped.includes(id);
return `<div class="petcard"><div class="big">${p.emoji}</div><b>${p.name}</b><small>${p.rarity} · бонус x${p.mult} · уровень ${lv}/5</small><button class="action" data-equip="${id}" style="margin:7px 2px 3px">${active?'Снять':'Выбрать'}</button><button class="action" data-upgrade="${id}" style="margin:3px 2px">${lv>=5?'Максимум':'Улучшить · '+fmt(cost)+' 🍞'}</button></div>`;
}).join(''):'<p class="muted">Пока питомцев нет. Загляни в порталы! 🌀</p>')+'</div>';
c.querySelectorAll('[data-equip]').forEach(b=>b.onclick=()=>{
let id=b.dataset.equip;
if(s.equipped.includes(id))s.equipped=s.equipped.filter(x=>x!==id);
else if(s.equipped.length<5)s.equipped.push(id);
else{alert('Можно выбрать не больше 5 питомцев!');return}
update();
});
c.querySelectorAll('[data-upgrade]').forEach(b=>b.onclick=()=>{
let id=b.dataset.upgrade,lv=petLevel(id),cost=lv*500;
if(lv>=5){alert('Максимальный уровень!');return}
if(s.coins<cost){alert('Не хватает печеогароков!');return}
s.coins-=cost;s.petLevels[id]=lv+1;update();
});
}
else if(tab==='inventory'){
const owned=items.filter(x=>s.itemsOwned.includes(x.id));
const equipped=items.filter(x=>s.itemsEquipped.includes(x.id));
c.innerHTML=`<h2>🎒 Инвентарь предметов</h2>
<div class="portal"><h3>📦 Таинственный сундук</h3><p>Внутри могут быть эпические, легендарные, мифические и секретные предметы, реликвии, артефакты, амулеты и кольца.</p><button class="action" id="chest">Открыть сундук · 1 500 🍞</button></div>
<p>Надето: <b>${equipped.length}/8</b></p><h3>✨ Мои предметы (${owned.length}/${items.length})</h3>
${owned.length?owned.map(item=>{
const active=s.itemsEquipped.includes(item.id);
return `<div class="inventory-card ${active?'equipped':''}"><div class="inventory-top"><div class="inventory-icon">${item.icon}</div><div class="inventory-info"><b>${item.name}</b><div><span class="rarity ${item.css}">${item.rarity}</span></div><small>${item.category}</small><small>${item.desc}</small></div></div><button class="action" data-item="${item.id}">${active?'Снять предмет':'Надеть предмет'}</button></div>`;
}).join(''):'<p class="muted">Инвентарь пуст. Открой свой первый сундук! 📦</p>'}`;
$('chest').onclick=openChest;
c.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{
const id=b.dataset.item;
if(s.itemsEquipped.includes(id))s.itemsEquipped=s.itemsEquipped.filter(x=>x!==id);
else{if(s.itemsEquipped.length>=8){alert('Можно надеть максимум 8 предметов!');return}s.itemsEquipped.push(id)}
update();
});
}
else if(tab==='luck'){
c.innerHTML=`<h2>🎡 Зал удачи</h2><div class="portal"><h3>Колесо космических призов</h3><p>Стоимость прокрутки: <b>2500 🍞</b>.</p><div style="font-size:56px;text-align:center;margin:18px">🎡</div><button class="action" id="spin">Крутить · 2500 🍞</button><p class="notice" id="luckResult">Выбери прокрутку! Удачи!</p></div>`;
$('spin').onclick=()=>{
if(s.coins<2500){$('luckResult').textContent='Не хватает печеогароков!';return}
s.coins-=2500;
const prizes=[{label:'10 000 🍞',coins:10000,weight:.5},{label:'5 000 🍞',coins:5000,weight:5},{label:'2 500 🍞',coins:2500,weight:10},{label:'1 000 🍞',coins:1000,weight:15},{label:'500 🍞',coins:500,weight:50},{label:'100 🍞',coins:100,weight:75}];
const total=prizes.reduce((sum,p)=>sum+p.weight,0);
let roll=Math.random()*total,prize=prizes[prizes.length-1];
for(const item of prizes){roll-=item.weight;if(roll<0){prize=item;break}}
s.coins+=prize.coins;s.level=Math.max(s.level,1+Math.floor(s.coins/100));
update();const result=$('luckResult');if(result)result.textContent='🎉 Выпало: '+prize.label+'!';
};
}
else if(tab==='skins'){
c.innerHTML=`<h2>🎨 Космические скины</h2><p class="notice">Каждый новый скин стоит 1000 🍞.</p>`+
skins.map((sk,i)=>`<div class="item"><span class="emoji">${sk.emoji}</span><div class="desc"><b>${sk.name}</b><small>${i===0?'Стандартный':'Новый облик слизи'}</small></div><button class="action" data-skin="${i}">${s.skin===i?'Выбран':i===0?'Выбрать':'1000 🍞'}</button></div>`).join('');
c.querySelectorAll('[data-skin]').forEach(b=>b.onclick=()=>{
let i=Number(b.dataset.skin);if(s.skin===i)return;
if(i===0)s.skin=0;
else if(s.coins>=1000){s.coins-=1000;s.skin=i}
else{alert('Не хватает печеогароков!');return}
update();
});
}
}

function openChest(){
if(s.coins<1500){alert('Не хватает печеогароков! Нужно 1500 🍞.');return}
s.coins-=1500;
const pool=[{rarity:'epic',weight:40},{rarity:'legendary',weight:25},{rarity:'mythic',weight:15},{rarity:'secret',weight:8},{rarity:'relic',weight:5},{rarity:'artifact',weight:3},{rarity:'amulet',weight:2.5},{rarity:'ring',weight:1.5}];
const total=pool.reduce((a,x)=>a+x.weight,0);let roll=Math.random()*total,chosen=pool[0];
for(const x of pool){roll-=x.weight;if(roll<0){chosen=x;break}}
const map={epic:'Эпический предмет',legendary:'Легендарный предмет',mythic:'Мифический предмет',secret:'Секретный предмет',relic:'Реликвия',artifact:'Артефакт',amulet:'Амулет',ring:'Магическое кольцо'};
const categoryItems=items.filter(x=>x.category===map[chosen.rarity]);
const prize=categoryItems[Math.floor(Math.random()*categoryItems.length)];
if(s.itemsOwned.includes(prize.id)){s.coins+=100;alert(`📦 Дубликат!\n${prize.icon} ${prize.name}\nТы получил 100 🍞.`)}
else{s.itemsOwned.push(prize.id);alert(`🎉 НОВЫЙ ПРЕДМЕТ!\n\n${prize.icon} ${prize.name}\n${prize.rarity}\n${prize.desc}`)}
update();
}
function portal(cost,pool){
if(s.coins<cost){alert('Не хватает печеогароков!');return}
s.coins-=cost;
let id=pool[Math.floor(Math.random()*pool.length)],p=pets.find(x=>x.id===id);
if(!p){update();return}
if(s.owned.includes(id)){s.coins+=50;alert(`${p.emoji} ${p.name} уже есть! +50 🍞`)}
else{s.owned.push(id);alert(`Новый питомец: ${p.emoji} ${p.name}!\nРедкость: ${p.rarity}`)}
update();
}

// Показываем уведомление, если питомец выдан за старое сохранение.
if(retroactivePetAward){
alert('🎁 НАГРАДА ЗА ПРОЙДЕННОГО БОССА!\n\nТы уже победил Повелителя измерений!\n\nПолучен питомец 🌌 Бог измерений!\nБонус: x100!\n\nОткрой вкладку «🐾 Питомцы» и нажми «Выбрать».');
}

update();
</script>
</body>
</html>
