<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🍞 ПЕЧЕГОР КЛИКЕР 02</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(160deg,#08091f,#17234b);color:#fff;font-family:Arial,sans-serif;min-height:100vh}
header{text-align:center;padding:20px}
h1{color:#8eeaff;text-shadow:0 0 15px #38bdf8}
.wrap{max-width:1000px;width:94%;margin:auto}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat,.panel{background:#142044;border:1px solid #425b91;border-radius:15px;padding:12px}
.stat{text-align:center}
.stat small{display:block;color:#b9c7e8}
.stat strong{font-size:20px}
.layout{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hero{text-align:center;min-height:380px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.slime{width:180px;height:155px;border-radius:50% 50% 42% 42%;background:radial-gradient(at 30% 20%,#fff,#65dff5 40%,#0875b8);box-shadow:0 0 40px #43dfff;position:relative;animation:bob 2s infinite}
@keyframes bob{50%{transform:translateY(-9px)}}
.eyes{position:absolute;top:60px;left:0;right:0;display:flex;justify-content:center;gap:40px}
.eye{width:16px;height:22px;background:#10213d;border-radius:50%}
.mouth{position:absolute;top:105px;left:calc(50% - 8px);width:16px;height:9px;border-bottom:3px solid #173451;border-radius:50%}
.tap{
border:0;background:none;padding:20px;cursor:pointer;
touch-action:none;user-select:none;-webkit-user-select:none;
}
.tap:active .slime{transform:scale(.93)}
.hint{color:#b9c7e8}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tab,.action{border:0;border-radius:9px;padding:10px;background:#24547a;color:white;font-weight:bold;cursor:pointer}
.tab.active{background:#55c9ed;color:#07152e}
.action{background:linear-gradient(135deg,#61dafa,#3d92e7);color:#07152e;margin:4px}
.action:disabled{opacity:.4;cursor:not-allowed}
.item,.portal,.petcard,.world-card{background:#0b1531;border:1px solid #34466f;border-radius:12px;padding:12px;margin:9px 0}
.item{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.desc{flex:1;min-width:120px}
.desc small,.muted,small{color:#b9c7e8}
.petgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.petcard{text-align:center}
.petcard .big{font-size:32px}
.petcard small{display:block;margin:4px}
.boss{text-align:center;background:#351c45;border:1px solid #a35b83;padding:14px;border-radius:14px;margin-top:12px}
.boss-icon{font-size:55px}
.progress,.boss-health{height:12px;background:#253452;border-radius:10px;overflow:hidden;margin:9px 0}
.progress span,.boss-health span{display:block;height:100%;background:linear-gradient(90deg,#5ee7ff,#a879ff)}
.notice{text-align:center;color:#aab8dc;font-size:12px}
@media(max-width:700px){.layout{grid-template-columns:1fr}.stats{font-size:13px}}
</style>
</head>
<body>
<header>
<h1>🍞 ПЕЧЕГОР КЛИКЕР 02</h1>
<p>Исследуй миры, собирай питомцев и побеждай боссов!</p>
</header>
<main class="wrap">
<div class="stats">
<div class="stat"><small>🍞 Печеогароки</small><strong id="coins">0</strong></div>
<div class="stat"><small>⚡ Энергия</small><strong id="energy">100 / 100</strong></div>
<div class="stat"><small>⭐ Уровень</small><strong id="level">1</strong></div>
</div>
<div class="layout">
<section class="panel hero">
<h3 id="rank">КОСМИЧЕСКИЙ НОВИЧОК</h3>
<div id="worldLabel">🌲 Лес</div>
<button class="tap" id="tap" type="button" aria-label="Нажать на слизь">
<div class="slime">
<div class="eyes"><i class="eye"></i><i class="eye"></i></div>
<div class="mouth"></div>
</div>
</button>
<p class="hint">Нажимай на слизь!</p>
<b id="perTap">+1 🍞</b>
<p class="notice" id="bonusText"></p>
</section>
<section class="panel">
<nav class="tabs" id="tabs">
<button class="tab active" data-tab="shop">🛒 Магазин</button>
<button class="tab" data-tab="worlds">🌍 Миры</button>
<button class="tab" data-tab="portals">🌀 Порталы</button>
<button class="tab" data-tab="pets">🐾 Питомцы</button>
<button class="tab" data-tab="skins">🎨 Скины</button>
<button class="tab" data-tab="luck">🎡 Удача</button>
<button class="tab" data-tab="inventory">🎒 Инвентарь</button>
<button class="tab" data-tab="rebirth">♻️ Перерождение</button>
<button class="tab" data-tab="index">📖 Индекс</button>
</nav>
<div id="content"></div>
</section>
</div>
</main>

<script>
'use strict';

const $=id=>document.getElementById(id);
const SAVE_KEY='pechegor-save';

const defaults={
coins:0,energy:100,maxEnergy:100,level:1,tapPower:1,auto:0,
owned:[],skin:0,upgrades:0,batteryUpgrades:0,equipped:[],
petLevels:{},itemsOwned:[],itemsEquipped:[],
unlockedWorlds:[0],currentWorld:0,bossHP:{},bossesDefeated:[],
rebirths:0,ownedSkins:[0]
};

function loadGame(){
let saved={};
try{saved=JSON.parse(localStorage.getItem(SAVE_KEY)||'{}')||{};}
catch(e){console.warn('Ошибка чтения сохранения:',e);}
const s={...defaults,...saved};
for(const k of ['owned','equipped','itemsOwned','itemsEquipped','unlockedWorlds','bossesDefeated','ownedSkins']){
if(!Array.isArray(s[k]))s[k]=defaults[k].slice();
}
s.petLevels=s.petLevels&&typeof s.petLevels==='object'?s.petLevels:{};
s.bossHP=s.bossHP&&typeof s.bossHP==='object'?s.bossHP:{};
s.coins=Math.max(0,Number(s.coins)||0);
s.energy=Math.max(0,Number(s.energy)||0);
s.maxEnergy=Math.max(1,Number(s.maxEnergy)||100);
s.level=Math.max(1,Number(s.level)||1);
s.tapPower=Math.max(1,Number(s.tapPower)||1);
s.auto=Math.max(0,Number(s.auto)||0);
s.rebirths=Math.max(0,Math.floor(Number(s.rebirths)||0));
s.currentWorld=Number.isInteger(s.currentWorld)?s.currentWorld:0;
s.unlockedWorlds=[...new Set([0,...s.unlockedWorlds.filter(n=>Number.isInteger(n)&&n>=0&&n<10)])];
if(!s.unlockedWorlds.includes(s.currentWorld))s.currentWorld=0;
s.equipped=s.equipped.filter(id=>s.owned.includes(id)).slice(0,5);
s.itemsEquipped=s.itemsEquipped.filter(id=>s.itemsOwned.includes(id)).slice(0,8);
s.ownedSkins=[...new Set([0,...s.ownedSkins.filter(n=>Number.isInteger(n)&&n>=0&&n<9)])];
if(!s.ownedSkins.includes(s.skin))s.skin=0;
return s;
}
let s=loadGame();
let tab='shop';

function save(){
try{localStorage.setItem(SAVE_KEY,JSON.stringify(s));}
catch(e){console.warn('Не удалось сохранить игру:',e);}
}

const worlds=[
{name:'Лес',icon:'🌲',desc:'Зелёные поляны и древние деревья.',cost:0,boss:'Древний древесник',bossIcon:'🌳',hp:100,reward:500,pet:'🦊'},
{name:'Пустыня',icon:'🏜️',desc:'Песчаные бури и золотые тайны.',cost:1000,boss:'Песчаный голем',bossIcon:'🗿',hp:500,reward:2500,pet:'🐪'},
{name:'Ледяной мир',icon:'❄️',desc:'Ледяные пещеры.',cost:5000,boss:'Ледяной дракон',bossIcon:'🐲',hp:2000,reward:10000,pet:'🐧'},
{name:'Космос',icon:'🚀',desc:'Звёзды и далёкие планеты.',cost:15000,boss:'Звёздный титан',bossIcon:'👾',hp:8000,reward:30000,pet:'🪐'},
{name:'Лавовый мир',icon:'🌋',desc:'Вулканы и огненные пещеры.',cost:40000,boss:'Повелитель лавы',bossIcon:'🔥',hp:30000,reward:80000,pet:'🐉'},
{name:'Подводный мир',icon:'🌊',desc:'Коралловые города.',cost:100000,boss:'Морской левиафан',bossIcon:'🐙',hp:100000,reward:200000,pet:'🦈'},
{name:'Облачный мир',icon:'☁️',desc:'Парящие острова.',cost:250000,boss:'Небесный страж',bossIcon:'🦅',hp:350000,reward:500000,pet:'🪽'},
{name:'Мир конфет',icon:'🍬',desc:'Шоколадные горы и карамельные реки.',cost:600000,boss:'Король конфет',bossIcon:'🍭',hp:1000000,reward:1200000,pet:'🍡'},
{name:'Мир призраков',icon:'👻',desc:'Призрачные замки.',cost:1500000,boss:'Король призраков',bossIcon:'👻',hp:3500000,reward:3000000,pet:'💀'},
{name:'Секретное измерение',icon:'🌀',desc:'Скрытая реальность.',cost:5000000,boss:'Повелитель измерений',bossIcon:'🌀',hp:10000000,reward:10000000,pet:'🔮'}
];

const pets=[
{id:'star',name:'Звёздный малыш',emoji:'⭐',rarity:'Обычный',mult:1},
{id:'moon',name:'Лунный котик',emoji:'🐈',rarity:'Редкий',mult:2},
{id:'alien',name:'Пузырчатый пришелец',emoji:'👾',rarity:'Эпический',mult:4},
{id:'dragon',name:'Космодракон',emoji:'🐉',rarity:'Легендарный',mult:8},
{id:'ghost',name:'Секретная слизь',emoji:'👻',rarity:'Секретный',mult:15},
{id:'fox',name:'Звёздная лисичка',emoji:'🦊',rarity:'Редкий',mult:3},
{id:'robot',name:'Робот-помощник',emoji:'🤖',rarity:'Обычный',mult:1},
{id:'unicorn',name:'Космический единорог',emoji:'🦄',rarity:'Эпический',mult:5},
{id:'octopus',name:'Галактический осьминог',emoji:'🐙',rarity:'Редкий',mult:3},
{id:'phoenix',name:'Золотой феникс',emoji:'🔥',rarity:'Легендарный',mult:10},
{id:'diamond',name:'Алмазный малыш',emoji:'💎',rarity:'Эпический',mult:6},
{id:'crown',name:'Королевская слизь',emoji:'👑',rarity:'Секретный',mult:20},
{id:'shark',name:'Космическая акула',emoji:'🦈',rarity:'Редкий',mult:4},
{id:'bear',name:'Медвежонок-комета',emoji:'🐻',rarity:'Обычный',mult:2},
{id:'planet',name:'Живая планета',emoji:'🪐',rarity:'Легендарный',mult:12},
{id:'comet',name:'Кометный король',emoji:'☄️',rarity:'Легендарный',mult:15},
{id:'nebula',name:'Туманная слизь',emoji:'🌌',rarity:'Секретный',mult:25},
{id:'blackhole',name:'Повелитель чёрной дыры',emoji:'🕳️',rarity:'Мифический',mult:35},
{id:'dimension_pet',name:'Бог измерений',emoji:'🌌',rarity:'Божественный',mult:100}
];

const items=[
{id:'epic_crystal',name:'Кристалл силы',icon:'💎',rarity:'Эпический',tap:.2,auto:0},
{id:'epic_star',name:'Звезда удачи',icon:'🌟',rarity:'Эпический',tap:.1,auto:2},
{id:'legend_crown',name:'Корона галактики',icon:'👑',rarity:'Легендарный',tap:.5,auto:0},
{id:'legend_sword',name:'Меч кометы',icon:'⚔️',rarity:'Легендарный',tap:.25,auto:5},
{id:'mythic_heart',name:'Сердце звезды',icon:'❤️‍🔥',rarity:'Мифический',tap:1,auto:0},
{id:'mythic_eye',name:'Око бездны',icon:'🧿',rarity:'Мифический',tap:.5,auto:15},
{id:'secret_key',name:'Ключ измерений',icon:'🗝️',rarity:'Секретный',tap:1.5,auto:0},
{id:'secret_cube',name:'Тайный куб',icon:'🧊',rarity:'Секретный',tap:0,auto:50},
{id:'relic_hourglass',name:'Песочные часы времени',icon:'⌛',rarity:'Реликвия',tap:.3,auto:10},
{id:'relic_feather',name:'Перышко вечности',icon:'🪶',rarity:'Реликвия',tap:.75,auto:0},
{id:'artifact_orb',name:'Сфера миров',icon:'🔮',rarity:'Артефакт',tap:2,auto:0},
{id:'artifact_book',name:'Книга космоса',icon:'📖',rarity:'Артефакт',tap:0,auto:100},
{id:'amulet_moon',name:'Лунный амулет',icon:'📿',rarity:'Амулет',tap:.4,auto:20},
{id:'amulet_sun',name:'Амулет солнца',icon:'☀️',rarity:'Амулет',tap:1,auto:0},
{id:'ring_magic',name:'Кольцо магии',icon:'💍',rarity:'Магическое кольцо',tap:.6,auto:25},
{id:'ring_void',name:'Кольцо пустоты',icon:'🌀',rarity:'Магическое кольцо',tap:0,auto:300}
];

const skins=[
{name:'Голубая слизь',emoji:'🩵'},
{name:'Розовая слизь',emoji:'🩷'},
{name:'Золотая слизь',emoji:'💛'},
{name:'Галактическая слизь',emoji:'💜'},
{name:'Пчёлка',emoji:'🐝'},
{name:'Красная слизь',emoji:'🔴'},
{name:'Лиса',emoji:'🦊'},
{name:'Шахматы',emoji:'♟️'},
{name:'Конус',emoji:'🚧'}
];

const fmt=n=>Math.floor(n).toLocaleString('ru-RU');
const petLevel=id=>Math.max(1,Math.min(5,Number(s.petLevels[id])||1));
const equippedItems=()=>s.itemsEquipped.map(id=>items.find(x=>x.id===id)).filter(Boolean);
const petMultiplier=()=>s.equipped.reduce((a,id)=>{
const p=pets.find(x=>x.id===id);
return a+(id==='dimension_pet'?99:(p?.mult||0)*.15*petLevel(id));
},0);
const itemTapBonus=()=>equippedItems().reduce((a,x)=>a+x.tap,0);
const itemAutoBonus=()=>equippedItems().reduce((a,x)=>a+x.auto,0);
const multiplier=()=>1+s.rebirths+petMultiplier()+itemTapBonus();
const autoIncome=()=>s.auto+itemAutoBonus();
const currentWorld=()=>worlds[s.currentWorld];

function update(){
$('coins').textContent=fmt(s.coins);
$('energy').textContent=`${Math.floor(s.energy)} / ${s.maxEnergy}`;
$('level').textContent=s.level;
$('perTap').textContent=`+${fmt(s.tapPower*multiplier())} 🍞`;
$('rank').textContent=s.level<5?'КОСМИЧЕСКИЙ НОВИЧОК':s.level<12?'ПОВЕЛИТЕЛЬ ПЕЧЕОГАРОКОВ':'КОСМИЧЕСКИЙ КОРОЛЬ';
$('worldLabel').textContent=currentWorld().icon+' '+currentWorld().name;
$('bonusText').textContent=`Бонус клика: +${Math.round((multiplier()-1)*100)}% · Перерождения: ${s.rebirths}`;
document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
render();
save();
}

function gain(){
if(s.energy<1){alert('Энергия закончилась! Подожди её восстановления.');return}
s.energy--;
const n=s.tapPower*multiplier();
s.coins+=n;
s.level=Math.max(s.level,1+Math.floor(s.coins/100));
update();
}

// Поддержка мыши и двух пальцев
const tapButton = $('tap');
let touchHandled = false;

tapButton.addEventListener('touchstart', function(e) {
    e.preventDefault();
    touchHandled = true;
    for (let i = 0; i < e.changedTouches.length; i++) {
        gain();
    }
}, { passive: false });

tapButton.addEventListener('click', function() {
    if (touchHandled) {
        touchHandled = false;
        return;
    }
    gain();
});

document.addEventListener('keydown',e=>{
if(e.code==='Space'&&!e.repeat&&!['INPUT','TEXTAREA','BUTTON'].includes(document.activeElement.tagName)){
e.preventDefault();gain();
}
});

$('tabs').addEventListener('click',e=>{
const b=e.target.closest('[data-tab]');
if(!b)return;
tab=b.dataset.tab;
update();
});

function buy(cost,fn){
if(s.coins<cost){alert('Не хватает печеогароков!');return}
s.coins-=cost;
fn();
update();
}

function render(){
const c=$('content');

if(tab==='shop'){
const tc=Math.floor(20*Math.pow(1.65,s.upgrades));
const ac=Math.floor(100*Math.pow(1.8,s.auto));
const bc=Math.floor(150*Math.pow(1.6,s.batteryUpgrades));
c.innerHTML=`
<h2>🛒 Магазин</h2>
<div class="item"><span>👆</span><div class="desc"><b>Сильный тап</b><small>+1 к силе нажатия</small></div><button class="action" data-buy="tap">🍞 ${fmt(tc)}</button></div>
<div class="item"><span>🤖</span><div class="desc"><b>Автосборщик</b><small>+1 печеогарок в секунду</small></div><button class="action" data-buy="auto">🍞 ${fmt(ac)}</button></div>
<div class="item"><span>⚡</span><div class="desc"><b>Батарея</b><small>+25 максимальной энергии</small></div><button class="action" data-buy="battery">🍞 ${fmt(bc)}</button></div>
<div class="item"><span>🔋</span><div class="desc"><b>Пополнить энергию</b><small>Полное восстановление</small></div><button class="action" data-buy="refill">🍞 5000</button></div>`;
}

else if(tab==='worlds'){
const w=currentWorld(),hp=s.bossHP[s.currentWorld]??w.hp;
const defeated=s.bossesDefeated.includes(s.currentWorld);
c.innerHTML=`<h2>🌍 Миры</h2>
<div class="portal"><h3>Сейчас: ${w.icon} ${w.name}</h3><p>${w.desc}</p></div>
${worlds.map((x,i)=>{
const unlocked=s.unlockedWorlds.includes(i);
return `<div class="world-card">
<h3>${x.icon} ${x.name}</h3><p class="muted">${unlocked?'Открыт':'Закрыт'}</p>
${unlocked?`<button class="action" data-enter="${i}">${s.currentWorld===i?'Ты здесь':'Перейти'}</button>`:`<button class="action" data-unlock="${i}" ${!s.bossesDefeated.includes(i-1)||s.coins<x.cost?'disabled':''}>Открыть · ${fmt(x.cost)} 🍞</button>`}
</div>`;
}).join('')}
<div class="boss">
<h3>👹 ${w.boss}</h3><div class="boss-icon">${w.bossIcon}</div>
<div class="boss-health"><span style="width:${Math.max(0,hp/w.hp*100)}%"></span></div>
<p>Здоровье: ${fmt(hp)} / ${fmt(w.hp)}</p>
<button class="action" data-attack ${defeated?'disabled':''}>⚔️ Атаковать</button>
${defeated?'<p>Босс побеждён!</p>':''}
</div>`;
}

else if(tab==='portals'){
c.innerHTML=`<h2>🌀 Порталы</h2>
<div class="portal"><h3>🟢 Зелёный портал</h3><p>Обычные и редкие питомцы</p><button class="action" data-portal="1">Открыть · 100 🍞</button></div>
<div class="portal"><h3>🟣 Фиолетовый портал</h3><p>Редкие и эпические питомцы</p><button class="action" data-portal="2">Открыть · 500 🍞</button></div>
<div class="portal"><h3>🟡 Золотой портал</h3><p>Редкие, легендарные и секретные питомцы</p><button class="action" data-portal="3">Открыть · 2000 🍞</button></div>`;
}

else if(tab==='pets'){
const owned=pets.filter(p=>s.owned.includes(p.id));
c.innerHTML=`<h2>🐾 Питомцы (${owned.length}/${pets.length})</h2>
<p class="muted">Выбери до пяти питомцев. Бог измерений даёт x100 к силе клика.</p>
<div class="petgrid">${owned.length?owned.map(p=>{
const lv=petLevel(p.id),active=s.equipped.includes(p.id);
return `<div class="petcard"><div class="big">${p.emoji}</div><b>${p.name}</b><small>${p.rarity} · уровень ${lv}/5</small>
<button class="action" data-equip="${p.id}">${active?'Снять':'Выбрать'}</button>
<button class="action" data-petup="${p.id}">${lv>=5?'Максимум':'Улучшить · '+fmt(lv*500)+' 🍞'}</button></div>`;
}).join(''):'<p>Пока питомцев нет. Открой портал!</p>'}</div>`;
}

else if(tab==='skins'){
c.innerHTML=`<h2>🎨 Скины</h2>${skins.map((x,i)=>`
<div class="item"><span>${x.emoji}</span><div class="desc"><b>${x.name}</b></div>
<button class="action" data-skin="${i}">${s.skin===i?'Выбран':s.ownedSkins.includes(i)?'Выбрать':'1000 🍞'}</button></div>`).join('')}`;
}

else if(tab==='luck'){
c.innerHTML=`<h2>🎡 Удача</h2><div class="portal"><h3>Колесо призов 🎡</h3><p>Стоимость: 2500 🍞</p><button class="action" data-spin>Крутить</button><p id="luckResult"></p></div>`;
}

else if(tab==='inventory'){
const owned=items.filter(x=>s.itemsOwned.includes(x.id));
c.innerHTML=`<h2>🎒 Инвентарь</h2>
<div class="portal"><h3>📦 Таинственный сундук</h3><p>Случайный редкий предмет · 1500 🍞</p><button class="action" data-chest>Открыть сундук</button></div>
<p>Надето: ${s.itemsEquipped.length}/8</p>
${owned.length?owned.map(x=>`<div class="item"><span>${x.icon}</span><div class="desc"><b>${x.name}</b><small>+${x.tap*100}% к клику · +${x.auto}/сек</small></div><button class="action" data-item="${x.id}">${s.itemsEquipped.includes(x.id)?'Снять':'Надеть'}</button></div>`).join(''):'<p>Инвентарь пуст.</p>'}`;
}

else if(tab==='rebirth'){
const cost=5000000;
c.innerHTML=`<h2>♻️ Перерождение</h2>
<div class="portal"><h3>Новое путешествие!</h3>
<p>Цена: <b>5 000 000 🍞</b></p>
<p>Перерождений: <b>${s.rebirths}</b></p>
<p>Постоянный бонус: <b>+${s.rebirths*100}% к клику</b></p>
<p>Множитель: x${1+s.rebirths}</p>
<button class="action" data-rebirth ${s.coins<cost?'disabled':''}>♻️ Переродиться</button></div>
<p class="muted">Сохраняются питомцы, уровни питомцев, предметы, экипировка, миры, боссы и скины.</p>
<p class="muted">Сбрасываются монеты, уровень, обычная сила клика, автосборщик и батарея.</p>`;
}

else if(tab==='index'){
const found=pets.filter(p=>s.owned.includes(p.id)).length;
const pct=Math.floor(found/pets.length*100);
c.innerHTML=`<h2>📖 Индекс питомцев</h2>
<div class="portal"><h3>Коллекция</h3><p>Найдено: ${found}/${pets.length}</p><p>Заполнено: ${pct}%</p><div class="progress"><span style="width:${pct}%"></span></div></div>
<div class="petgrid">${pets.map(p=>{
const has=s.owned.includes(p.id);
return `<div class="petcard"><div class="big">${has?p.emoji:'❔'}</div><b>${has?p.name:'Неизвестный питомец'}</b><small>${has?p.rarity:'???'}</small><small>${has?'Бонус x'+p.mult:'Пока не найден'}</small></div>`;
}).join('')}</div>`;
}
}

$('content').addEventListener('click',e=>{
const b=e.target.closest('button');
if(!b)return;

if(b.dataset.buy){
const kind=b.dataset.buy;
if(kind==='tap'){
const cost=Math.floor(20*Math.pow(1.65,s.upgrades));
buy(cost,()=>{s.tapPower++;s.upgrades++});
}
if(kind==='auto'){
const cost=Math.floor(100*Math.pow(1.8,s.auto));
buy(cost,()=>s.auto++);
}
if(kind==='battery'){
const cost=Math.floor(150*Math.pow(1.6,s.batteryUpgrades));
buy(cost,()=>{s.maxEnergy+=25;s.energy=s.maxEnergy;s.batteryUpgrades++});
}
if(kind==='refill'){
if(s.energy>=s.maxEnergy){alert('Энергия уже полная!');return}
buy(5000,()=>s.energy=s.maxEnergy);
}
return;
}

if(b.dataset.enter!==undefined){
s.currentWorld=Number(b.dataset.enter);update();return;
}
if(b.dataset.unlock!==undefined){
const i=Number(b.dataset.unlock),w=worlds[i];
if(!s.bossesDefeated.includes(i-1)){alert('Сначала победи предыдущего босса!');return}
if(s.coins<w.cost){alert('Не хватает печеогароков!');return}
s.coins-=w.cost;s.unlockedWorlds.push(i);s.currentWorld=i;update();return;
}
if(b.hasAttribute('data-attack')){
const i=s.currentWorld,w=currentWorld();
if(s.bossesDefeated.includes(i))return;
const hp=s.bossHP[i]??w.hp;
const damage=Math.max(1,s.tapPower*multiplier()*10);
s.bossHP[i]=Math.max(0,hp-damage);
if(s.bossHP[i]===0){
s.bossesDefeated.push(i);
s.coins+=w.reward;
if(i===9&&!s.owned.includes('dimension_pet')){
s.owned.push('dimension_pet');s.petLevels.dimension_pet=1;
}
if(i<9&&!s.unlockedWorlds.includes(i+1))s.unlockedWorlds.push(i+1);
alert(`🏆 Победа над ${w.boss}!\nНаграда: ${fmt(w.reward)} 🍞${i===9?'\nПолучен Бог измерений!':''}`);
}
update();return;
}
if(b.dataset.portal){
const pools={
1:['star','star','robot','bear','moon','fox','shark'],
2:['moon','fox','octopus','alien','unicorn','diamond','shark'],
3:['alien','dragon','ghost','phoenix','diamond','crown','planet','comet','nebula','blackhole']
};
const cost=[0,100,500,2000][Number(b.dataset.portal)];
if(s.coins<cost){alert('Не хватает печеогароков!');return}
s.coins-=cost;
const id=pools[b.dataset.portal][Math.floor(Math.random()*pools[b.dataset.portal].length)];
const p=pets.find(x=>x.id===id);
if(s.owned.includes(id)){s.coins+=50;alert(`${p.emoji} ${p.name} уже есть! +50 🍞`)}
else{s.owned.push(id);alert(`Новый питомец: ${p.emoji} ${p.name}!`)}
update();return;
}
if(b.dataset.equip){
const id=b.dataset.equip;
if(s.equipped.includes(id))s.equipped=s.equipped.filter(x=>x!==id);
else if(s.equipped.length<5)s.equipped.push(id);
else{alert('Можно выбрать максимум 5 питомцев!');return}
update();return;
}
if(b.dataset.petup){
const id=b.dataset.petup,lv=petLevel(id),cost=lv*500;
if(lv>=5){alert('Максимальный уровень!');return}
if(s.coins<cost){alert('Не хватает печеогароков!');return}
s.coins-=cost;s.petLevels[id]=lv+1;update();return;
}
if(b.dataset.skin!==undefined){
const i=Number(b.dataset.skin);
if(s.ownedSkins.includes(i)){s.skin=i;update();return}
if(s.coins<1000){alert('Не хватает печеогароков!');return}
s.coins-=1000;s.ownedSkins.push(i);s.skin=i;update();return;
}
if(b.hasAttribute('data-spin')){
if(s.coins<2500){$('luckResult').textContent='Не хватает печеогароков!';return}
s.coins-=2500;
const prizes=[10000,5000,2500,1000,500,100];
const weights=[.5,5,10,15,50,75];
let r=Math.random()*weights.reduce((a,x)=>a+x,0),prize=100;
for(let i=0;i<prizes.length;i++){r-=weights[i];if(r<0){prize=prizes[i];break}}
s.coins+=prize;s.level=Math.max(s.level,1+Math.floor(s.coins/100));
update();alert(`🎉 Выпало ${fmt(prize)} 🍞`);return;
}
if(b.hasAttribute('data-chest')){
if(s.coins<1500){alert('Нужно 1500 🍞');return}
s.coins-=1500;
const available=items.filter(x=>!s.itemsOwned.includes(x.id));
if(!available.length){s.coins+=100;alert('Все предметы уже собраны! +100 🍞')}
else{
const p=available[Math.floor(Math.random()*available.length)];
s.itemsOwned.push(p.id);alert(`🎉 Получен предмет: ${p.icon} ${p.name}`);
}
update();return;
}
if(b.dataset.item){
const id=b.dataset.item;
if(s.itemsEquipped.includes(id))s.itemsEquipped=s.itemsEquipped.filter(x=>x!==id);
else if(s.itemsEquipped.length<8)s.itemsEquipped.push(id);
else{alert('Максимум 8 предметов!');return}
update();return;
}
if(b.hasAttribute('data-rebirth')){
const cost=5000000;
if(s.coins<cost){alert('Нужно 5 000 000 🍞');return}
if(!confirm('Переродиться? Обычный прогресс будет сброшен, коллекция сохранится.'))return;
s.coins=0;s.energy=100;s.maxEnergy=100;s.level=1;s.tapPower=1;
s.auto=0;s.upgrades=0;s.batteryUpgrades=0;s.rebirths++;
update();
alert(`♻️ Перерождение №${s.rebirths}!\nБонус к клику: +${s.rebirths*100}%`);
return;
}
});

setInterval(()=>{
let changed=false;
if(s.energy<s.maxEnergy){s.energy=Math.min(s.maxEnergy,s.energy+1);changed=true}
if(autoIncome()>0){
s.coins+=autoIncome();
s.level=Math.max(s.level,1+Math.floor(s.coins/100));
changed=true;
}
if(changed)update();
},1000);

update();
</script>
</body>
</html>
