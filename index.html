
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ПЕЧЕГОР КЛИКЕР 02</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;color:#fff;font-family:Arial,sans-serif;
 background:radial-gradient(circle at top,#29205c,#09091b 65%);
 padding:18px;overflow-x:hidden
}
body:before{
 content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;
 background-image:radial-gradient(white 1px,transparent 1px);
 background-size:45px 45px;animation:stars 25s linear infinite
}
@keyframes stars{to{background-position:90px 90px}}
@keyframes appear{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes pulse{50%{box-shadow:0 0 25px #a855f7}}
@keyframes pop{0%{transform:scale(.7)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.container{max-width:850px;margin:auto;position:relative;animation:appear .6s}
h1{text-align:center;color:#e9b8ff;text-shadow:0 0 18px #a855f7;letter-spacing:2px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:18px 0}
.stat,.panel{
 background:#ffffff10;border:1px solid #ffffff25;border-radius:16px;
 padding:13px;text-align:center;backdrop-filter:blur(8px)
}
.stat strong{display:block;font-size:20px;color:#f0c8ff;margin-top:5px}
.panel{margin:12px 0;animation:appear .4s}
.slime{
 width:145px;height:125px;margin:18px auto 12px;border-radius:48% 48% 42% 42%;
 background:linear-gradient(145deg,#9cffdc,#27b88d);
 box-shadow:inset -12px -10px 0 #138b75,0 0 30px #42ffc0;
 cursor:pointer;position:relative;animation:bounce 2s infinite;
 transition:transform .12s
}
.slime:active{transform:scale(.9)}
.slime:before{
 content:"•  •";white-space:pre;position:absolute;top:38px;left:0;right:0;
 font-size:28px;color:#173c39;font-weight:bold
}
.slime:after{
 content:"⌣";position:absolute;top:61px;left:0;right:0;
 font-size:27px;color:#173c39
}
.slime.skin-blue{background:linear-gradient(145deg,#a4d9ff,#347bdb);box-shadow:inset -12px -10px 0 #2353a1,0 0 30px #53aaff}
.slime.skin-pink{background:linear-gradient(145deg,#ffc4ed,#e65caa);box-shadow:inset -12px -10px 0 #a92c78,0 0 30px #ff71d1}
.slime.skin-gold{background:linear-gradient(145deg,#fff0a0,#d99b18);box-shadow:inset -12px -10px 0 #98700e,0 0 30px #ffd54a}
.slime.skin-galaxy{background:linear-gradient(145deg,#c5a5ff,#5b32a8);box-shadow:inset -12px -10px 0 #35166f,0 0 30px #b58aff}
.slime.skin-bee{background:linear-gradient(145deg,#fff16a,#e5a900);box-shadow:inset -12px -10px 0 #997000,0 0 30px #ffe45c}
.slime.skin-red{background:linear-gradient(145deg,#ffaaaa,#d83434);box-shadow:inset -12px -10px 0 #8f1e1e,0 0 30px #ff5555}
.slime.skin-fox:after{content:"🦊";top:30px;font-size:65px}
.slime.skin-chess:after{content:"♟️";top:28px;font-size:65px}
.slime.skin-cone:after{content:"🍦";top:28px;font-size:65px}
.slime.skin-hamster:after{content:"🐹";top:28px;font-size:65px}
.slime.skin-raccoon:after{content:"🦝";top:28px;font-size:65px}
.click-hint{color:#cbb8ed;font-size:13px}
.tabs{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:15px 0}
button{
 border:0;border-radius:11px;padding:11px 14px;background:#8b5cf6;
 color:white;font-weight:bold;cursor:pointer;transition:.2s
}
button:hover{filter:brightness(1.2);transform:translateY(-2px)}
button:active{transform:scale(.96)}
button:disabled{opacity:.4;cursor:not-allowed;transform:none}
.tab{background:#ffffff18;border:1px solid #ffffff30}
.tab.active{background:#a855f7;animation:pulse 2s infinite}
.item{
 display:flex;justify-content:space-between;align-items:center;gap:10px;
 background:#ffffff0c;padding:12px;border-radius:12px;margin:9px 0;
 text-align:left
}
.item small{display:block;color:#c9b9df;margin-top:4px}
.item button{white-space:nowrap}
.muted{color:#c9b9df}
.big{font-size:24px;font-weight:bold;color:#f0c8ff}
.result{min-height:25px;color:#ffe08a;margin-top:12px}
.footer{text-align:center;color:#887da7;font-size:12px;margin:22px}
@media(max-width:550px){
 body{padding:10px}.stats{grid-template-columns:repeat(2,1fr)}
 .item{align-items:flex-start;flex-direction:column}
 .item button{width:100%}
}
</style>
</head>
<body>
<div class="container">
 <h1>🌌 ПЕЧЕГОР КЛИКЕР 02</h1>

 <div class="stats">
  <div class="stat">🍞 Печеогароки<strong id="coins">0</strong></div>
  <div class="stat">⚡ Энергия<strong id="energy">100 / 100</strong></div>
  <div class="stat">⭐ Уровень<strong id="level">1</strong></div>
  <div class="stat">👥 Онлайн (демо)<strong id="online">124</strong></div>
 </div>

 <div class="panel">
  <div>Твоя печегорская слизь</div>
  <div class="slime" id="slime" role="button" aria-label="Нажми на слизь"></div>
  <div class="big" id="perTap">+1 🍞</div>
  <div class="click-hint">Нажимай на слизь или пробел!</div>
  <div class="muted" id="progress">До следующего уровня: 100</div>
 </div>

 <div class="tabs">
  <button class="tab active" data-tab="shop">🛒 Магазин</button>
  <button class="tab" data-tab="portals">🌀 Порталы</button>
  <button class="tab" data-tab="pets">🐾 Питомцы</button>
  <button class="tab" data-tab="skins">🎨 Скины</button>
  <button class="tab" data-tab="luck">🎰 Зал удачи</button>
 </div>

 <div class="panel" id="content"></div>
 <div class="footer">ПЕЧЕГОР КЛИКЕР 02 · Прогресс сохраняется автоматически</div>
</div>

<script>
"use strict";

const $ = id => document.getElementById(id);
const fmt = n => Math.floor(n).toLocaleString("ru-RU");

const defaultState = {
 coins:0, energy:100, maxEnergy:100,
 tapPower:1, upgrades:0, auto:0,
 level:1, xp:0, pets:[], equipped:[],
 portals:0, skins:["green"], skin:"green"
};

let s = {...defaultState};

try {
 const saved = JSON.parse(localStorage.getItem("pechegor-save"));
 if(saved && typeof saved === "object"){
  s = {...defaultState,...saved};
 }
} catch(e) {
 console.warn("Не удалось загрузить сохранение",e);
}

s.coins = Math.max(0,Number(s.coins)||0);
s.energy = Math.max(0,Math.min(Number(s.energy)||0,s.maxEnergy));
s.maxEnergy = Math.max(100,Number(s.maxEnergy)||100);
s.pets = Array.isArray(s.pets)?s.pets:[];
s.equipped = Array.isArray(s.equipped)?s.equipped:[];
s.skins = Array.isArray(s.skins)?s.skins:["green"];

let currentTab = "shop";
let luckMessage = "Выбери прокрутку. Удачи!";

const petsData = [
 {id:"cat",name:"Котик",emoji:"🐱",mult:0.15,cost:500},
 {id:"dog",name:"Пёсик",emoji:"🐶",mult:0.25,cost:1200},
 {id:"dragon",name:"Дракон",emoji:"🐉",mult:0.5,cost:3500},
 {id:"alien",name:"Пришелец",emoji:"👽",mult:0.8,cost:8000},
 {id:"phoenix",name:"Феникс",emoji:"🐦‍🔥",mult:1.5,cost:20000}
];

const skinsData = [
 {id:"green",name:"Обычный",cost:0},
 {id:"blue",name:"Голубой",cost:1000},
 {id:"pink",name:"Розовый",cost:1000},
 {id:"gold",name:"Золотой",cost:1000},
 {id:"galaxy",name:"Галактический",cost:1000},
 {id:"bee",name:"Пчелиный",cost:1000},
 {id:"red",name:"Красный",cost:1000},
 {id:"fox",name:"Лисёнок",cost:1000},
 {id:"chess",name:"Шахматный",cost:1000},
 {id:"cone",name:"Мороженое",cost:1000}
];

function save(){
 try{
  localStorage.setItem("pechegor-save",JSON.stringify(s));
 }catch(e){
  console.warn("Не удалось сохранить игру",e);
 }
}

function petLevel(id){
 return s.pets.filter(p=>p===id).length;
}

function mult(){
 return 1+s.equipped.reduce((a,id)=>{
  const p=petsData.find(x=>x.id===id);
  return a+(p?p.mult*petLevel(id):0);
 },0);
}

function update(){
 $("coins").textContent=fmt(s.coins);
 $("energy").textContent=`${Math.floor(s.energy)} / ${s.maxEnergy}`;
 $("level").textContent=s.level;
 $("perTap").textContent=`+${fmt(s.tapPower*mult())} 🍞`;
 $("progress").textContent=`Опыт: ${fmt(s.xp)} / ${s.level*100}`;
 $("slime").className="slime"+(s.skin==="green"?"":" skin-"+s.skin);
 renderTab();
 save();
}

function gain(amount){
 s.coins+=amount;
 s.xp+=Math.max(1,Math.floor(amount));
 while(s.xp>=s.level*100){
  s.xp-=s.level*100;
  s.level++;
  s.coins+=s.level*50;
 }
}

function clickSlime(){
 if(s.energy<1){
  $("perTap").textContent="⚡ Нет энергии!";
  return;
 }
 s.energy=Math.max(0,s.energy-1);
 gain(s.tapPower*mult());
 $("slime").style.animation="none";
 void $("slime").offsetWidth;
 $("slime").style.animation="pop .18s";
 update();
}

$("slime").addEventListener("click",clickSlime);

document.addEventListener("keydown",e=>{
 if(e.code==="Space" && !["INPUT","TEXTAREA"].includes(document.activeElement.tagName)){
  e.preventDefault();
  clickSlime();
 }
});

function buy(cost,action){
 if(s.coins<cost)return false;
 s.coins-=cost;
 action();
 update();
 return true;
}

function renderTab(){
 const box=$("content");
 if(!box)return;

 if(currentTab==="shop"){
  const tapCost=Math.floor(20*Math.pow(1.65,s.upgrades));
  const autoCost=Math.floor(100*Math.pow(1.8,s.auto));
  box.innerHTML=`
   <h2>🛒 Магазин</h2>
   <div class="item"><div>👆 Улучшить тап<small>Сила клика: ${fmt(s.tapPower)} → ${fmt(s.tapPower+1)}</small></div><button id="buyTap">Купить · ${fmt(tapCost)}</button></div>
   <div class="item"><div>🤖 Автосборщик<small>Доход: ${fmt(s.auto)} печеогароков/сек</small></div><button id="buyAuto">Купить · ${fmt(autoCost)}</button></div>
   <div class="item"><div>🔋 Большая батарея<small>Максимум энергии +50</small></div><button id="buyBattery">Купить · 150</button></div>
   <div class="item"><div>⚡ Пополнить энергию<small>Восстанавливает всю энергию</small></div><button id="buyEnergy">Купить · 5 000</button></div>`;
  $("buyTap").onclick=()=>buy(tapCost,()=>{s.upgrades++;s.tapPower++;});
  $("buyAuto").onclick=()=>buy(autoCost,()=>s.auto++);
  $("buyBattery").onclick=()=>buy(150,()=>s.maxEnergy+=50);
  $("buyEnergy").onclick=()=>buy(5000,()=>s.energy=s.maxEnergy);
 }

 if(currentTab==="portals"){
  const portals=[
   {name:"🌿 Лесной портал",cost:100},
   {name:"🔥 Огненный портал",cost:500},
   {name:"🌌 Космический портал",cost:2000}
  ];
  box.innerHTML="<h2>🌀 Порталы</h2><p class='muted'>Открывай порталы и собирай коллекцию!</p>"+
   portals.map((p,i)=>`<div class="item"><div>${p.name}<small>Открыто: ${s["portal"+i]||0}</small></div><button data-portal="${i}">Открыть · ${p.cost}</button></div>`).join("");
  box.querySelectorAll("[data-portal]").forEach(btn=>{
   btn.onclick=()=>{
    const i=Number(btn.dataset.portal);
    const cost=portals[i].cost;
    if(s.coins<cost)return;
    s.coins-=cost;
    s["portal"+i]=(s["portal"+i]||0)+1;
    s.portals++;
    const rewards=["🌱","🔥","🌟","💎","👑"];
    const prize=rewards[Math.floor(Math.random()*rewards.length)];
    alert("Ты открыл портал! Выпало: "+prize);
    update();
   };
  });
 }

 if(currentTab==="pets"){
  box.innerHTML="<h2>🐾 Питомцы</h2><p class='muted'>Питомцы усиливают твои клики. Можно экипировать до 5 разных питомцев.</p>"+
  petsData.map(p=>{
   const count=petLevel(p.id);
   const active=s.equipped.includes(p.id);
   return `<div class="item"><div>${p.emoji} ${p.name}<small>Бонус: +${p.mult*100}% · Уровень: ${count}/5</small></div>
   <button data-pet="${p.id}" ${count>=5?"disabled":""}>${count>=5?"Максимум":"Купить · "+fmt(p.cost)}</button>
   <button data-equip="${p.id}" ${count===0?"disabled":""}>${active?"Снять":"Надеть"}</button></div>`;
  }).join("");
  box.querySelectorAll("[data-pet]").forEach(btn=>{
   btn.onclick=()=>{
    const p=petsData.find(x=>x.id===btn.dataset.pet);
    if(!p||petLevel(p.id)>=5)return;
    buy(p.cost,()=>s.pets.push(p.id));
   };
  });
  box.querySelectorAll("[data-equip]").forEach(btn=>{
   btn.onclick=()=>{
    const id=btn.dataset.equip;
    if(!petLevel(id))return;
    if(s.equipped.includes(id)){
     s.equipped=s.equipped.filter(x=>x!==id);
    }else if(s.equipped.length<5){
     s.equipped.push(id);
    }
    update();
   };
  });
 }

 if(currentTab==="skins"){
  box.innerHTML="<h2>🎨 Скины</h2><p class='muted'>Выбирай внешний вид своей слизи.</p>"+
  skinsData.map(sk=>{
   const owned=s.skins.includes(sk.id);
   return `<div class="item"><div>🎨 ${sk.name}<small>${owned?"Уже открыт":"Новый внешний вид"}</small></div>
   <button data-skin="${sk.id}">${s.skin===sk.id?"Выбран":owned?"Выбрать":"Купить · "+sk.cost}</button></div>`;
  }).join("");
  box.querySelectorAll("[data-skin]").forEach(btn=>{
   btn.onclick=()=>{
    const id=btn.dataset.skin;
    const sk=skinsData.find(x=>x.id===id);
    if(!sk)return;
    if(!s.skins.includes(id)){
     if(s.coins<sk.cost)return;
     s.coins-=sk.cost;
     s.skins.push(id);
    }
    s.skin=id;
    update();
   };
  });
 }

 if(currentTab==="luck"){
  box.innerHTML=`<h2>🎰 Зал удачи</h2>
   <p class="muted">Одна прокрутка стоит 2 500 печеогароков.</p>
   <div class="big">🎡</div>
   <button id="spin">Крутить · 2 500 🍞</button>
   <div class="result" id="luckResult">${luckMessage}</div>`;
  $("spin").onclick=()=>{
   if(s.coins<2500){
    luckMessage="Не хватает печеогароков!";
    renderTab();
    return;
   }
   s.coins-=2500;
   const prizes=[
    {label:"100 печеогароков",value:100},
    {label:"500 печеогароков",value:500},
    {label:"2 000 печеогароков",value:2000},
    {label:"5 000 печеогароков",value:5000},
    {label:"10 000 печеогароков",value:10000}
   ];
   const prize=prizes[Math.floor(Math.random()*prizes.length)];
   gain(prize.value);
   luckMessage="🎉 Выпало: "+prize.label+"!";
   update();
  };
 }
}

document.querySelectorAll(".tab").forEach(btn=>{
 btn.addEventListener("click",()=>{
  currentTab=btn.dataset.tab;
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b===btn));
  renderTab();
 });
});

setInterval(()=>{
 s.energy=Math.min(s.maxEnergy,s.energy+1);
 if(s.auto>0)gain(s.auto*mult());
 update();
},1000);

setInterval(()=>{
 $("online").textContent=100+Math.floor(Math.random()*80);
},4000);

update();
</script>
</body>
</html>
